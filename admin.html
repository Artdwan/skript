      tags.appendChild(el("span", stateClass(stt.k), stt.text));
    }
    drawTags();
    b.appendChild(tags);
    var miss = el("div","miss");
    b.appendChild(miss);

    /* Карточка сразу открыта на правку: отдельного режима просмотра больше нет.
       Поля и есть просмотр, а всё введённое сохраняется само. */
    {
      var f = {};
      f["ученик"]    = mkInp("text", "", r["ученик"]);
      f["класс"]     = mkSel([""].concat(PUPIL_KL), r["класс"]);
      f["родитель"]  = mkInp("text", "", r["родитель"]);
      f["источник"]  = mkSource(r["источник"], function(){ saveNow(); });
      f["старт"]     = mkInp("date", "", r["старт"]);
      f["окончание"] = mkInp("date", "", r["окончание"]);
      var form2 = el("div","form");
      [["Ученик","ученик"],["Класс","класс"],["Родитель","родитель"],
       ["Источник","источник"],["Старт","старт"],["Окончание","окончание"]]
        .forEach(function(pair){
          /* источник — не просто поле, внутри кнопки: label им мешает */
          form2.appendChild(pair[1] === "источник"
            ? fldBox(pair[0], f[pair[1]], true)
            : fld(pair[0], f[pair[1]]));
        });
      b.appendChild(form2);

      /* ——— контакты ———
         На экране только то, что заполнено. Остальное прячется за «+»:
         у кого-то есть только телеграм родителя, у кого-то дискорд и телефон. */
      var CT = {};
      var ctSave = null;          /* появится ниже, когда заведём автосохранение */
      CONTACTS.forEach(function(c){
        var v = ctValue(r, c.k);
        if(v) CT[c.k] = v;
      });
      var ctWrap = el("div","cts");
      function drawCts(){
        ctWrap.innerHTML = "";
        var head = el("div","cts-head");
        head.appendChild(el("span","cts-t","Контакты"));
        var left = CONTACTS.filter(function(c){ return CT[c.k] === undefined; });
        if(left.length){
          var sel = mkSel(left.map(function(c){ return c.name; }), left[0].name);
          var add = el("button","btn btn-sm","Добавить");
          add.type = "button";
          add.addEventListener("click", function(){
            var pick = left.filter(function(c){ return c.name === sel.value; })[0];
            if(pick){ CT[pick.k] = ""; drawCts(); if(typeof drawMiss === "function") drawMiss(); }
          });
          head.appendChild(sel);
          head.appendChild(add);
        }
        ctWrap.appendChild(head);
        var any = false;
        CONTACTS.forEach(function(c){
          if(CT[c.k] === undefined) return;
          any = true;
          var row = el("div","ct-row");
          row.appendChild(el("span","ct-name", c.name));
          var i = mkInp("text", c.ph, CT[c.k]);
          i.setAttribute("data-ct", c.k);
          i.addEventListener("input", function(){
            CT[c.k] = i.value;
            if(ctSave) ctSave();
          });
          row.appendChild(i);
          var x = el("button","ct-x","✕");
          x.type = "button";
          x.title = "убрать";
          x.addEventListener("click", function(){
            delete CT[c.k];
            drawCts();
            if(ctSave) ctSave();
          });
          row.appendChild(x);
          ctWrap.appendChild(row);
        });
        if(!any) ctWrap.appendChild(el("p","col-hint","Ни одного контакта не записано."));
      }
      b.appendChild(el("p","col-hint",
        "Предметы, форматы и цены правятся ниже, в направлениях. Статус считается сам: " +
        "до даты старта — «начнёт», после даты окончания — «ушёл». " +
        "Отдельно его выставлять не нужно."));
      drawCts();
      b.appendChild(ctWrap);

      /* ——— чего не хватает ———
         Пустые поля карточки, контакты и то, без чего не выставить счёт.
         Каждое слово кликается: поле получает фокус, контакт заводится. */
      function drawMiss(){
        miss.innerHTML = "";
        var items = [];
        [["класс","класс"],["родитель","родитель"],["источник","источник"],["старт","дата старта"]]
          .forEach(function(p){
            if(String(r[p[0]] === undefined ? "" : r[p[0]]).trim()) return;
            items.push([p[1], function(){
              var n = f[p[0]];
              var t = n.tagName ? n : n.querySelector("select");
              if(t){ t.focus(); if(t.scrollIntoView) t.scrollIntoView({block:"center"}); }
            }]);
          });
        CONTACTS.forEach(function(c){
          if(String(CT[c.k] === undefined ? "" : CT[c.k]).trim()) return;
          items.push([c.name.toLowerCase(), function(){
            if(CT[c.k] === undefined){ CT[c.k] = ""; drawCts(); }
            var t = ctWrap.querySelector('[data-ct="' + c.k + '"]');
            if(t){ t.focus(); if(t.scrollIntoView) t.scrollIntoView({block:"center"}); }
          }]);
        });
        var ds = dirsOf(r["ученик"]);
        if(!ds.length) items.push(["ни одного предмета", function(){ dirAdd = true; dirEdit = null; render(); }]);
        ds.forEach(function(dd){
          var open = function(){ dirEdit = dd.id; dirAdd = false; render(); };
          var subj = String(dd["предмет"] || "предмет");
          if(!dirPrice(dd)) items.push(["цена: " + subj, open]);
          if(perLesson(dd) && !dirDays(dd)) items.push(["дни занятий: " + subj, open]);
        });
        if(!items.length){ miss.hidden = true; return; }
        miss.hidden = false;
        miss.appendChild(el("span","miss-k","Не заполнено:"));
        items.forEach(function(it, i){
          var a = el("button","link", it[0]);
          a.type = "button";
          a.addEventListener("click", it[1]);
          miss.appendChild(a);
          if(i < items.length - 1) miss.appendChild(document.createTextNode(", "));
        });
      }
      drawMiss();

      var note = document.createElement("textarea");
      note.rows = 2;
      note.placeholder = "чем занимаемся, о чём помнить";
      note.value = r["заметка"] || "";
      var nl = el("label");
      nl.style.display = "grid"; nl.style.gap = "4px";
      nl.style.fontSize = "12.5px"; nl.style.color = "var(--muted)";
      nl.style.marginTop = "10px";
      nl.appendChild(el("span", null, "Заметка"));
      nl.appendChild(note);
      b.appendChild(nl);

      /* ——— карточка сохраняется сама ———
         Кнопки «Сохранить» нет: её легко забыть, а правка одного поля дешёвая.
         Списки, даты и контакты уходят сразу, имя — когда поле отпустили:
         переименование тащит за собой направления, на каждой букве это ни к чему.
         Список слева перерисуется при закрытии, иначе карточка пересоберётся
         под руками и поле потеряет фокус. */
      var okTimer = null, sendTimer = null, seq = 0;
      function setStat(t, cls){
        status.textContent = t || "";
        status.className = "dstat" + (cls ? " " + cls : "");
      }
      function repaintHead(){
        h.textContent = r["ученик"];
        meta.textContent = [r["класс"] ? r["класс"] + " класс" : ""]
          .concat(dirsOf(r["ученик"]).map(function(x){
            return x["предмет"] + " " + x["формат"] + (x["группа"] ? " " + x["группа"] : "");
          }))
          .filter(Boolean).join(" · ");
        drawTags();
        drawMiss();
      }
      function saveNow(){
        clearTimeout(sendTimer);
        /* если таблицу успели перечитать, берём свежую строку, а не ту, что была при открытии */
        r = pupilById(r.id) || r;
        var nm = f["ученик"].value.trim();
        var patch = {};
        Object.keys(f).forEach(function(k){ patch[k] = f[k].value; });
        patch["ученик"] = nm;
        patch["заметка"] = note.value;
        /* убранный контакт стирается в таблице, а не просто исчезает с экрана */
        CONTACTS.forEach(function(c){
          patch[c.k] = CT[c.k] === undefined ? "" : String(CT[c.k]).trim();
        });
        patch["статус"] = pupilState(patch).k;
        var same = Object.keys(patch).every(function(k){
          return String(r[k] === undefined ? "" : r[k]) === String(patch[k]);
        });
        if(same) return;
        /* у каждой правки свой номер: ответ на старую не перебьёт свежую жалобу */
        var my = ++seq;
        if(!nm){ setStat("без имени не сохраню", "bad"); return; }
        /* одинаковые имена смешали бы оплаты: они привязаны к имени, а не к строке */
        if(nameTaken(nm, r.id)){ setStat("такое имя уже есть — допиши уточнение", "bad"); return; }
        var was = r["ученик"], renamed = was !== nm;
        var moves = renamed ? dirsOf(was) : [];
        /* оплаты и счета тоже привязаны к имени: без этого после переименования
           в карточке было бы «нет оплат», а деньги висели бы на старом имени */
        function onName(sheet){
          return renamed ? (DATA[sheet] || []).filter(function(o){
            return String(o["ученик"] || "").trim() === String(was).trim();
          }) : [];
        }
        var pays = onName("Оплаты"), bills = onName("Счета");
        localPatch("Ученики", r.id, patch);
        moves.forEach(function(x){ localPatch("Направления", x.id, {"ученик":nm}); });
        pays.forEach(function(x){ localPatch("Оплаты", x.id, {"ученик":nm}); });
        bills.forEach(function(x){ localPatch("Счета", x.id, {"ученик":nm}); });
        repaintHead();
        setStat("сохраняю…");
        /* при переименовании тянем за собой направления — они привязаны по имени */
        var follow = moves.map(function(x){ return ["Направления", x.id]; })
          .concat(pays.map(function(x){ return ["Оплаты", x.id]; }))
          .concat(bills.map(function(x){ return ["Счета", x.id]; }));
        send("update","Ученики",{id:r.id, row:patch}).then(function(){
          return follow.reduce(function(chain, x){
            return chain.then(function(){
              return send("update", x[0], {id:x[1], row:{"ученик":nm}});
            });
          }, Promise.resolve());
        }).then(function(){
          if(my !== seq) return;
          setStat("сохранено", "ok");
          clearTimeout(okTimer);
          okTimer = setTimeout(function(){ if(my === seq) setStat(""); }, 2500);
        }).catch(function(e){
          if(keyDied(e)) return;
          if(my !== seq) return;
          setStat("не сохранилось: " + e.message, "bad");
        });
      }
      function saveSoon(){ clearTimeout(sendTimer); sendTimer = setTimeout(saveNow, 600); }
      flushSave = saveNow;
      Object.keys(f).forEach(function(k){
        if(k === "источник") return;          /* у него свой колбэк */
        f[k].addEventListener("change", saveNow);
        if(k === "ученик") f[k].addEventListener("blur", saveNow);
        else if(f[k].tagName === "INPUT") f[k].addEventListener("input", saveSoon);
      });
      note.addEventListener("change", saveNow);
      note.addEventListener("input", saveSoon);
      ctSave = saveSoon;

      var acts = el("div","row-actions");
      acts.style.marginTop = "14px";
      var close2 = el("button","btn btn-ghost","Закрыть");
      close2.addEventListener("click", closeDrawer);
      acts.appendChild(close2);
      /* Удаление ученика: два нажатия, вместе с ним уходят его направления.
         Оплаты остаются — это история, её стирать нельзя. */
      var drop = el("button","link","Удалить ученика");
      var armedP = false;
      drop.addEventListener("click", function(){
        var mineDirs = dirsOf(r["ученик"]);
        if(!armedP){
          armedP = true;
          drop.textContent = "точно удалить" +
            (mineDirs.length ? " вместе с направлениями (" + mineDirs.length + ")?" : "?");
          return;
        }
        var paid = paidBy(r["ученик"]);
        localDrop("Ученики", r.id);
        mineDirs.forEach(function(x){ localDrop("Направления", x.id); });
        pupilOpen = null; dirEdit = null; dirAdd = false;
        render();
        bg(send("delete","Ученики",{id:r.id}).then(function(){
          return mineDirs.reduce(function(chain, x){
            return chain.then(function(){ return send("delete","Направления",{id:x.id}); });
          }, Promise.resolve());
        }), paid ? "Ученик удалён, оплаты остались в истории" : "Ученик удалён");
      });
      acts.appendChild(drop);
      b.appendChild(acts);
      b.appendChild(el("p","col-hint",
        "Оплаты, счета и предметы привязаны к имени. При переименовании они переезжают " +
        "на новое имя сами. При удалении ученика оплаты остаются: это история."));
    }

    b.appendChild(dirSection(r));

    var ps = el("div","dsec");
    ps.appendChild(el("div","dsec-h","Оплаты ученика"));
    var mine = DATA["Оплаты"].filter(function(o){ return o["ученик"] === r["ученик"]; }).reverse();
    if(!mine.length){
      ps.appendChild(el("p","empty","Оплат пока нет."));
    } else {
      ps.appendChild(payTable(mine, false));
      ps.appendChild(el("p","col-hint", "Всего оплачено: " + sum +
        ". «Правка» открывает строку: можно поменять дату, сумму и чек или удалить оплату."));
    }
    var orph = orphanPays(r);
    if(orph.length) ps.appendChild(orphanBox(r, orph));
    var pf = el("div","form");
    pf.style.marginTop = "12px";
    var pday = mkInp("date", "", today());
    var ms = monthSum(r["ученик"]);
    /* Две суммы, а не одна: скидка считается от полной, а платят итог.
       Оплатили полтора месяца — вписываете полную сумму за них, а не абонемент. */
    var full = mkInp("number", ms ? String(ms) : "сколько без скидки", ms ? String(ms) : "");
    var disc = mkSel(PAY_DISC.map(function(x){ return x.name; }), PAY_DISC[0].name);
    var amt  = mkInp("number", ms ? String(ms) : "", ms ? String(ms) : "");
    var chek = mkSel(["нет","да"], "нет");
    var padd = el("button","btn","Записать оплату");
    var hasGrp = dirsOf(r["ученик"]).some(function(x){ return !isInd(x); });
    function discOf(){
      return PAY_DISC.filter(function(x){ return x.name === disc.value; })[0] || PAY_DISC[0];
    }
    var calc = el("p","col-hint","");
    function recount(){
      var base = parseFloat(String(full.value).replace(",", "."));
      var x = discOf();
      if(!(base > 0)){
        calc.textContent = x.k ? "Впишите сумму без скидки — от неё считается скидка." : "";
        return;
      }
      var out = Math.round(base * (1 - x.k) * 100) / 100;
      amt.value = String(out);
      calc.textContent = x.k ? (Math.round(x.k * 100) + "% от " + base + " — к оплате " + out)
                             : "";
    }
    disc.addEventListener("change", function(){
      var x = discOf();
      if(x.grpOnly && !hasGrp){
        toast("Эта скидка только на групповой абонемент");
        disc.value = PAY_DISC[0].name;
      }
      recount();
    });
    full.addEventListener("change", recount);
    [["Дата",pday],["Сумма без скидки",full],["Скидка",disc],["К оплате",amt],["Чек",chek]]
      .forEach(function(pair){ pf.appendChild(fld(pair[0], pair[1])); });
    pf.appendChild(padd);
    padd.addEventListener("click", function(){
      if(!amt.value){ toast("Сумма пустая"); return; }
      var row = {"дата":pday.value || today(), "ученик":r["ученик"],
                 "сумма":amt.value, "чек":chek.value, "заметка":discOf().note};
      localAdd("Оплаты", row);
      render();
      bg(addRemote("Оплаты", row), "Оплата записана");
    });
    ps.appendChild(pf);
    ps.appendChild(calc);
    ps.appendChild(el("p","col-hint",
      "Скидка считается от суммы без скидки — впишите туда то, что клиент платит " +
      "за весь период: остаток месяца, месяц, два. «К оплате» можно поправить руками, " +
      "если нужно округлить."));
    b.appendChild(ps);

    d.appendChild(b);
    w.appendChild(d);
  }

  function mark(v){
    var td = el("td");
    var ok = String(v).toLowerCase() === "да";
    td.appendChild(el("span", ok ? "pill" : "pill pill-warn", ok ? "есть" : "нет"));
    return td;
  }

  /* ——— Оплаты ——— */

  /* Таблица оплат с правкой и удалением. withPupil — показывать колонку «Ученик». */
  function payTable(rows, withPupil){
    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    var cols = withPupil ? ["Дата","Ученик","Сумма","Чек",""] : ["Дата","Сумма","Чек",""];
    tb.appendChild(head(cols));
    var body = document.createElement("tbody");
    rows.forEach(function(row){
      var tr = document.createElement("tr");
      if(String(payEdit) === String(row.id)){
        var fd = mkInp("date", "", row["дата"]);
        var fs = mkInp("number", "", row["сумма"]);
        var fc = mkSel(["нет","да"], String(row["чек"] || "нет"));
        fd.style.minWidth = "152px"; fs.style.minWidth = "88px"; fc.style.minWidth = "84px";
        var c1 = el("td"); c1.appendChild(fd); tr.appendChild(c1);
        if(withPupil) tr.appendChild(el("td","muted", row["ученик"]));
        var c2 = el("td"); c2.appendChild(fs); tr.appendChild(c2);
        var c3 = el("td"); c3.appendChild(fc); tr.appendChild(c3);
        var c4 = el("td");
        var acts = el("div","row-actions");
        var ok = el("button","btn btn-sm","Сохранить");
        var no = el("button","btn btn-ghost btn-sm","Отмена");
        var del = el("button","link link-warn","удалить");
        var armed = false;
        ok.addEventListener("click", function(){
          var patch = {"дата":fd.value, "сумма":fs.value, "чек":fc.value};
          localPatch("Оплаты", row.id, patch);
          payEdit = null;
          render();
          bg(send("update","Оплаты",{id:row.id, row:patch}), "Оплата исправлена");
        });
        no.addEventListener("click", function(){ payEdit = null; render(); });
        del.addEventListener("click", function(){
          if(!armed){
            armed = true;
            del.textContent = "точно удалить?";
            setTimeout(function(){ armed = false; del.textContent = "удалить"; }, 4000);
            return;
          }
          localDrop("Оплаты", row.id);
          payEdit = null;
          render();
          bg(send("delete","Оплаты",{id:row.id}), "Оплата удалена");
        });
        acts.appendChild(ok); acts.appendChild(no); acts.appendChild(del);
        c4.appendChild(acts); tr.appendChild(c4);
      } else {
        tr.appendChild(el("td","muted", row["дата"] || "—"));
        if(withPupil) tr.appendChild(el("td", null, row["ученик"]));
        tr.appendChild(el("td", null, row["сумма"]));
        tr.appendChild(mark(row["чек"]));
        var c5 = el("td");
        var ed = el("button","link","правка");
        ed.addEventListener("click", function(){ payEdit = row.id; render(); });
        c5.appendChild(ed);
        tr.appendChild(c5);
      }
      body.appendChild(tr);
    });
    tb.appendChild(body); tw.appendChild(tb);
    return tw;
  }


  /* ——— цифры над оплатами ———
     Всего — по всем записям. Этот месяц — только те, у кого дата стоит.
     Ожидание на следующий — сумма месячных абонементов тех, кто учится;
     поурочные (пара, индивидуально) сюда не попадают: их месяц зависит
     от числа занятий, а мы его не знаем. Скидки тоже не угадываем. */
  function payStats(){
    var all = 0, cur = 0, noDate = 0;
    var m = today().slice(0, 7);
    DATA["Оплаты"].forEach(function(o){
      var v = parseFloat(String(o["сумма"] || "").replace(",", ".")) || 0;
      all += v;
      var d = String(o["дата"] || "").trim();
      if(!d){ noDate++; return; }
      if(d.slice(0, 7) === m) cur += v;
    });
    var next = 0, perLessonWho = [];
    DATA["Ученики"].forEach(function(r){
      if(pupilState(r).k !== "учится") return;
      dirsOf(r["ученик"]).forEach(function(d){
        if(perLesson(d)){
          if(perLessonWho.indexOf(r["ученик"]) < 0) perLessonWho.push(r["ученик"]);
          return;
        }
        next += parseFloat(String(dirMonth(d)).replace(",", ".")) || 0;
      });
    });
    return {all:all, cur:cur, noDate:noDate, next:next, perLesson:perLessonWho.length, month:m};
  }
  function money(n){
    return String(Math.round(n * 100) / 100);
  }
  /* 1 оплата, 2 оплаты, 5 оплат, 21 оплата */
  function plural(n, one, few, many){
    var m10 = n % 10, m100 = n % 100;
    if(m10 === 1 && m100 !== 11) return one;
    if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function monthName(ym){
    var names = ["январь","февраль","март","апрель","май","июнь",
                 "июль","август","сентябрь","октябрь","ноябрь","декабрь"];
    var i = parseInt(String(ym).slice(5, 7), 10) - 1;
    return names[i] || ym;
  }
  function nextMonthName(ym){
    var y = parseInt(String(ym).slice(0, 4), 10);
    var i = parseInt(String(ym).slice(5, 7), 10);
    return monthName((i === 12 ? (y + 1) : y) + "-" + (i === 12 ? "01" : String(i + 1)));
  }
  /* ——— фильтр периода ———
     Месяцы берём из самих оплат, а не из календаря: пустых кнопок не будет.
     Оплаты без даты в месяц и в период не попадают никогда — для них
     отдельная кнопка, иначе они молча теряются. */
  function payMonths(){
    var seen = {}, out = [];
    DATA["Оплаты"].forEach(function(o){
      var d = String(o["дата"] || "").trim();
      if(d.length < 7) return;
      if(!seen[d.slice(0, 7)]){ seen[d.slice(0, 7)] = true; out.push(d.slice(0, 7)); }
    });
    out.sort();
    out.reverse();
    return out;
  }
  function payNoDate(){
    return DATA["Оплаты"].filter(function(o){
      return !String(o["дата"] || "").trim();
    }).length;
  }
  function payMatch(o){
    var d = String(o["дата"] || "").trim();
    if(payF.mode === "nodate") return !d;
    if(payF.mode === "month")  return d.slice(0, 7) === payF.month;
    if(payF.mode === "range"){
      if(!d) return false;
      if(payF.from && d < payF.from) return false;
      if(payF.to   && d > payF.to)   return false;
      return true;
    }
    return true;
  }
  function payMonthLabel(ym){
    return monthName(ym) + " " + String(ym).slice(0, 4);
  }
  function payWhat(){
    if(payF.mode === "month")  return payMonthLabel(payF.month);
    if(payF.mode === "nodate") return "без даты";
    if(payF.mode === "range"){
      return "с " + (payF.from ? fmtShort(payF.from) : "начала") +
             " по " + (payF.to ? fmtShort(payF.to) : "сегодня");
    }
    return "за всё время";
  }

  function payBar(){
    var bar = el("div","bar");
    var seg = el("div","seg");
    function chip(label, on, fn){
      var b = el("button", null, label);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.addEventListener("click", fn);
      seg.appendChild(b);
    }
    chip("все", payF.mode === "all", function(){ payF.mode = "all"; render(); });
    payMonths().slice(0, 6).forEach(function(m){
      chip(payMonthLabel(m), payF.mode === "month" && payF.month === m, function(){
        payF.mode = "month"; payF.month = m; render();
      });

    var nd = payNoDate();

      render();

    t.addEventListener("change", pick);

    rng.appendChild(el("span","muted","по"));
    rng.appendChild(t);
    if(payF.mode !== "all"){
      var off = el("button","btn btn-ghost btn-sm","сбросить");
      off.addEventListener("click", function(){
        payF = {mode:"all", month:"", from:"", to:""};
        render();
      });
      rng.appendChild(off);
    }
    bar.appendChild(rng);
    return bar;
  }

  function statTile(label, value, note){
    var s = el("div","stat");

    s.appendChild(el("div","stat-v", value));
    s.appendChild(el("div","stat-n", note || ""));

  /* ════════════════════════ счета ════════════════════════
     Выставить счета: выбрать формат, учеников и период → получить черновики,
     поправить суммы и число занятий → одобрить. Одобренные ложатся в лист
     «Счета» со статусом «выставлен» и уходят в телеграм: сначала строка,
     кому счёт, следом — готовый текст для родителя. Когда пришёл чек,
     «оплачен» превращает счёт в запись в «Оплатах». */

  /* Текст реквизитов — дословно тот, что дал Артур. После перехода на ЧУП
     реквизиты сменятся: править здесь. */
  var PAY_REQ = "Реквизиты для оплаты:\n\nОплата через ЕРИП\nБанки НКФО\nАльфабанк\n" +
                "Пополнение по номеру:\n+375333054763";
  /* как скидка называется в тексте родителю */
  var DISC_CLIENT = {
    "50% — первый абонемент":      "скидка 50% на первый абонемент",
    "30% — 3 и более абонементов": "скидка 30% при оплате трёх и более абонементов"
  };

  var billF = {open:false, fmt:"all", kind:"month", ym:"", from:"", to:"",
               unit:"period", picked:{}, drafts:null};
  var billView = "open";

  function num(v){ return parseFloat(String(v === undefined || v === null ? "" : v).replace(",", ".")) || 0; }
  function r2(n){ return Math.round(n * 100) / 100; }
  function rub(n){
    n = r2(n);
    return (n % 1 ? n.toFixed(2).replace(".", ",") : String(n)) + "р";
  }
  /* зачёркивание символами, а не разметкой: переживает копирование в Директ и Viber */
  function strike(t){
    return String(t).split("").map(function(ch){ return ch + "̶"; }).join("");
  }
  function cap(t){ t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function ymAdd(ym, k){
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + k;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + "-" + pad2(m + 1);
  }
  function monthSpan(ym){
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
    var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return [ym + "-01", ym + "-" + pad2(last)];
  }
  function dayUTC(iso){
    return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)));
  }
  /* Сколько занятий по дням недели между датами включительно.
     Праздники и переносы не знаем — число правится в черновике. */
  function lessonsIn(days, from, to){
    var set = parseDays(days).map(function(x){ return x.d; });
    if(!set.length || !from || !to || from > to) return 0;
    var n = 0;
    for(var t = dayUTC(from), end = dayUTC(to); t <= end; t += 86400000){
      if(set.indexOf(WCODES[(new Date(t).getUTCDay() + 6) % 7]) >= 0) n++;
    }
    return n;
  }
  function dmText(iso){ return fmtShort(iso).replace(/\s\d{4}$/, ""); }
  function monthGen(ym){
    return ["января","февраля","марта","апреля","мая","июня","июля","августа",
            "сентября","октября","ноября","декабря"][Number(String(ym).slice(5, 7)) - 1] || ym;
  }
  function rangeText(a, b){
    if(a.slice(0, 4) === b.slice(0, 4)) return dmText(a) + " - " + fmtShort(b);
    return fmtShort(a) + " - " + fmtShort(b);
  }
  function pupilByName(name){
    var k = nameKey(name);
    return DATA["Ученики"].filter(function(x){ return nameKey(x["ученик"]) === k; })[0] || null;
  }
  function billPeriod(){
    if(!billF.ym) billF.ym = ymAdd(today().slice(0, 7), 1);
    if(billF.kind === "month"){
      var sp = monthSpan(billF.ym);
      return {kind:"month", ym:billF.ym, from:sp[0], to:sp[1]};
    }
    return {kind:"range", from:billF.from, to:billF.to};
  }
  /* 50% — только новому, только на первый абонемент и только группе (справочник фактов) */
  function isFirstBill(name, per){
    var k = nameKey(name);
    var r = pupilByName(name);
    var st = r ? String(r["старт"] || "").trim() : "";
    /* новый — это начавший не раньше прошлого месяца. Давний ученик без оплат
       в таблице — это пробел в учёте, а не первый абонемент */
    if(!st || !per || !per.from || st < ymAdd(per.from.slice(0, 7), -1) + "-01") return false;
    /* непривязанные оплаты на похожее имя — может, это его: скидку не угадываем */
    if(r && orphanPays(r).length) return false;
    var paid = DATA["Оплаты"].some(function(o){ return nameKey(o["ученик"]) === k; });
    var billed = DATA["Счета"].some(function(b){
      return nameKey(b["ученик"]) === k && String(b["статус"]) === "оплачен";
    });
    return !paid && !billed;
  }
  function fmtMatch(d){
    var fm = String(d["формат"] || "").trim();
    if(billF.fmt === "group") return fm === "группа";
    if(billF.fmt === "pair")  return fm === "пара";
    if(billF.fmt === "ind")   return fm === "индивидуально";
    return true;
  }
  /* Кандидаты: направления учащихся под выбранный формат.
     Кто ушёл до начала периода или начнёт после его конца — в списке,
     но без галочки. */
  function billCands(per){
    var out = [];
    DATA["Направления"].forEach(function(d){
      if(!fmtMatch(d)) return;
      var r = pupilByName(d["ученик"]);
      if(!r) return;
      var st = String(r["старт"] || "").trim(), en = String(r["окончание"] || "").trim();
      var off = (per.from && en && en < per.from) || (per.to && st && st > per.to) ||
                (String(r["статус"] || "").trim() === "ушёл" && !en);
      out.push({d:d, r:r, off:!!off});
    });
    out.sort(function(a, b){
      return String(a.r["ученик"]).localeCompare(String(b.r["ученик"]), "ru") ||
             String(a.d["предмет"]).localeCompare(String(b.d["предмет"]), "ru");
    });
    return out;
  }
  function picked(c){
    var v = billF.picked[c.d.id];
    return v === undefined ? !c.off : v;
  }

  /* ——— черновик одного счёта ——— */
  function makeDraft(c, per){
    var d = c.d, r = c.r, pl = perLesson(d);
    var st = String(r["старт"] || "").trim(), en = String(r["окончание"] || "").trim();
    var from = per.from, to = per.to;
    /* занятия считаем только внутри учёбы ученика */
    var a = st && st > from ? st : from, b = en && en < to ? en : to;
    var days = dirDays(d);
    var one = pl && billF.unit === "one";
    var n = one ? 1 : lessonsIn(days, a, b);
    var price = pl ? num(d["цена_занятия"]) : 0;
    var x = {dir:d.id, ученик:r["ученик"], предмет:d["предмет"], формат:d["формат"],
             группа:d["группа"] || "", per:per, pl:pl, one:one, n:n, price:price,
             full:0, disc:PAY_DISC[0], sum:0, ok:true, warn:[], hint:null,
             text:"", textEdited:false};
    if(pl){
      if(!price) x.warn.push("не указана цена занятия");
      if(!one && !days) x.warn.push("не указаны дни занятий — впиши число занятий");
      x.full = r2(price * n);
    } else {
      var ab = num(dirMonth(d));
      var mDays = dirDays(d);
      if(!ab) x.warn.push("не указан абонемент");
      if(per.kind === "month"){
        x.full = ab;
        var inMonth = lessonsIn(mDays, from, to);
        if(st && st > from && st <= to && inMonth){
          /* пришёл в середине месяца: остаток по цене занятия этого месяца */
          var left = lessonsIn(mDays, st, to);
          x.hint = {sum:r2(ab * left / inMonth),
                    text:"старт " + dmText(st) + ": по расписанию " + left + " из " + inMonth +
                         " занятий — " + rub(ab * left / inMonth) + ". По правилу первый абонемент — " +
                         "остаток месяца плюс весь следующий: для этого выбери свой период."};
        }
      } else {
        x.warn.push("свой период — впиши сумму");
        /* подсказка по правилу справочника: каждый месяц по цене занятия этого месяца */
        if(ab && mDays && from && to && from <= to){
          var total = 0, parts = [];
          for(var ym = from.slice(0, 7); ym <= to.slice(0, 7); ym = ymAdd(ym, 1)){
            var sp = monthSpan(ym);
            var all = lessonsIn(mDays, sp[0], sp[1]);
            var part = lessonsIn(mDays, a > sp[0] ? a : sp[0], b < sp[1] ? b : sp[1]);
            if(!all || !part) continue;
            total += ab * part / all;
            parts.push(part === all ? "весь " + monthName(ym) + " " + rub(ab)
                                    : part + " из " + all + " занятий " + monthGen(ym) +
                                      " " + rub(ab * part / all));
          }
          if(parts.length) x.hint = {sum:r2(total), text:"по расписанию: " + parts.join(" + ") +
                                                        " = " + rub(total)};
        }
      }
      if(isFirstBill(r["ученик"], per)) x.disc = PAY_DISC[1];
      else if(orphanPays(r).length)
        x.warn.push("есть непривязанные оплаты на похожее имя — скидку 50% не ставлю, проверь в карточке");
    }
    x.sum = r2(x.full * (1 - x.disc.k));
    x.text = billText(x);
    return x;
  }
  function billWhat(x){
    var when;
    if(x.one) when = "1 занятие";
    else if(x.per.kind === "month") when = monthName(x.per.ym) + " " + x.per.ym.slice(0, 4);
    else when = (x.per.from && x.per.to) ? rangeText(x.per.from, x.per.to) : "";
    var t = cap(x.предмет) + (when ? ", " + when : "");
    if(x.pl && !x.one && x.n) t += " - " + x.n + " " + plural(x.n, "занятие", "занятия", "занятий") +
                                   " по " + rub(x.price);
    return t;
  }
  function billText(x){
    var line = "К оплате: " + rub(x.sum);
    if(x.disc.k && x.full > x.sum)
      line += " " + strike(rub(x.full)) + " (" + (DISC_CLIENT[x.disc.name] || x.disc.note) + ")";
    return PAY_REQ + "\n\n" + billWhat(x) + "\n" + line;
  }
  /* строка для Артура: кому этот счёт и куда его слать */
  function billHead(b){
    var r = pupilByName(b["ученик"]) || {};
    var out = ["Счёт: " + b["ученик"] + (r["класс"] ? ", " + r["класс"] + " класс" : "")];
    if(r["родитель"]) out.push("Родитель: " + r["родитель"]);
    CONTACTS.forEach(function(c){
      var v = ctValue(r, c.k);
      if(v) out.push(c.name + ": " + v);
    });
    out.push("За что: " + b["период"] + " — " + rub(num(b["сумма"])));
    out.push("Текст для родителя — следующим сообщением.");
    return out.join("\n");
  }

  /* ——— мастер: шаг 1, выбор ——— */
  function billPick(box){
    var per = billPeriod();
    var bar = el("div","bar");
    var seg = el("div","seg");
    [["all","все"],["group","группы"],["pair","пары"],["ind","индивидуальные"]].forEach(function(o){
      var btn = el("button", null, o[1]);
      btn.setAttribute("aria-pressed", billF.fmt === o[0] ? "true" : "false");
      btn.addEventListener("click", function(){ billF.fmt = o[0]; render(); });
      seg.appendChild(btn);
    });
    bar.appendChild(seg);
    var seg2 = el("div","seg");
    [["month","месяц"],["range","свой период"]].forEach(function(o){
      var btn = el("button", null, o[1]);
      btn.setAttribute("aria-pressed", billF.kind === o[0] ? "true" : "false");
      btn.addEventListener("click", function(){ billF.kind = o[0]; render(); });
      seg2.appendChild(btn);
    });
    bar.appendChild(seg2);
    if(billF.kind === "month"){
      var cur = today().slice(0, 7);
      var opts = [-1, 0, 1, 2, 3].map(function(k){ return ymAdd(cur, k); });
      var ms = document.createElement("select");
      ms.className = "bill-month";
      opts.forEach(function(ym, i){
        var o = document.createElement("option");
        o.value = ym;
        o.textContent = monthName(ym) + " " + ym.slice(0, 4) +
                        (i === 1 ? " · этот" : (i === 2 ? " · следующий" : ""));
        ms.appendChild(o);
      });
      if(opts.indexOf(billF.ym) < 0) billF.ym = opts[2];
      ms.value = billF.ym;
      ms.addEventListener("change", function(){ billF.ym = ms.value; render(); });
      bar.appendChild(ms);
    } else {
      var rng = el("div","range");
      rng.appendChild(el("span","muted","с"));
      var f1 = mkInp("date", "", billF.from), f2 = mkInp("date", "", billF.to);
      rng.appendChild(f1);
      rng.appendChild(el("span","muted","по"));
      rng.appendChild(f2);
      function pickRange(){ billF.from = f1.value; billF.to = f2.value; render(); }
      f1.addEventListener("change", pickRange);
      f2.addEventListener("change", pickRange);
      bar.appendChild(rng);
    }
    box.appendChild(bar);
    if(billF.fmt !== "group"){
      var bar2 = el("div","bar");
      bar2.appendChild(el("span","muted","Пары и индивидуальные считать:"));
      var seg3 = el("div","seg");
      [["period","по расписанию за период"],["one","одно занятие"]].forEach(function(o){
        var btn = el("button", null, o[1]);
        btn.setAttribute("aria-pressed", billF.unit === o[0] ? "true" : "false");
        btn.addEventListener("click", function(){ billF.unit = o[0]; render(); });
        seg3.appendChild(btn);
      });
      bar2.appendChild(seg3);
      box.appendChild(bar2);
    }
    if(per.kind === "range" && !(per.from && per.to && per.from <= per.to)){
      box.appendChild(el("p","empty","Выбери даты периода: с какого и по какое число."));
      return;
    }

    var cands = billCands(per);
    if(!cands.length){
      box.appendChild(el("p","empty","Под этот формат учеников нет."));
      return;
    }
    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    tb.className = "bill-pick";
    tb.appendChild(head(["", "Ученик", "Предмет", "Формат", "Занятий", "Сумма"]));
    var body = document.createElement("tbody");
    var countBtn = el("button","btn","");
    function recount(){
      var n = cands.filter(picked).length;
      countBtn.textContent = "Выставить счета (" + n + ")";
      countBtn.disabled = !n;
    }
    cands.forEach(function(c){
      var dr = makeDraft(c, per);
      var tr = document.createElement("tr");
      var td0 = el("td");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = picked(c);
      cb.addEventListener("change", function(){ billF.picked[c.d.id] = cb.checked; recount(); });
      td0.appendChild(cb);
      tr.appendChild(td0);
      var tdn = el("td", null, c.r["ученик"]);
      if(c.off) tdn.appendChild(el("span","muted"," · " + pupilState(c.r).text));
      tr.appendChild(tdn);
      tr.appendChild(el("td", null, c.d["предмет"]));
      tr.appendChild(el("td","muted", String(c.d["формат"] || "") +
                                       (c.d["группа"] ? " · " + c.d["группа"] : "")));
      tr.appendChild(el("td", null, String(dr.n)));
      tr.appendChild(el("td", dr.warn.length ? "warn-t" : null,
                        dr.full ? rub(dr.sum) + (dr.disc.k ? " · −" + Math.round(dr.disc.k * 100) + "%" : "")
                                : "впишешь сам"));
      body.appendChild(tr);
    });
    tb.appendChild(body);
    tw.appendChild(tb);
    box.appendChild(tw);

    var acts = el("div","row-actions");
    acts.style.marginTop = "12px";
    var all = el("button","btn btn-ghost btn-sm","отметить всех");
    all.addEventListener("click", function(){
      cands.forEach(function(c){ billF.picked[c.d.id] = true; }); render();
    });
    var none = el("button","btn btn-ghost btn-sm","снять всех");
    none.addEventListener("click", function(){
      cands.forEach(function(c){ billF.picked[c.d.id] = false; }); render();
    });
    countBtn.addEventListener("click", function(){
      billF.drafts = cands.filter(picked).map(function(c){ return makeDraft(c, per); });
      render();
    });
    acts.appendChild(countBtn); acts.appendChild(all); acts.appendChild(none);
    box.appendChild(acts);
    recount();
  }

  /* ——— мастер: шаг 2, черновики на одобрение ———
     Поля правятся на месте, без перерисовки всей страницы: иначе ушёл бы фокус. */
  function billDraftsView(box){
    var list = billF.drafts;
    var go = el("button","btn","");
    var why = el("p","col-hint","");
    function ready(x){ return x.ok && x.sum > 0; }
    function recount(){
      var n = list.filter(ready).length;
      var skip = list.filter(function(x){ return x.ok && !(x.sum > 0); }).length;
      go.textContent = "Одобрить и отправить (" + n + ")";
      go.disabled = !n;
      why.textContent = skip ? "Без суммы не уйдут: " + skip + ". Впиши сумму или сними галочку." : "";
    }
    box.appendChild(el("p","col-hint",
      "Проверь каждый счёт. Число занятий, цена, сумма, скидка и текст правятся прямо здесь. " +
      "В телеграм уйдут только отмеченные: сначала кому счёт, следом текст для родителя."));
    list.forEach(function(x){
      var card = el("div","bill");
      var top = el("label","bill-top");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = x.ok;
      cb.addEventListener("change", function(){
        x.ok = cb.checked; card.classList.toggle("off", !x.ok); recount();
      });
      top.appendChild(cb);
      top.appendChild(el("strong", null, x.ученик));
      top.appendChild(el("span","muted", " · " + x.предмет + " · " + x.формат +
                                         (x.группа ? " · " + x.группа : "")));
      card.appendChild(top);
      x.warn.forEach(function(t){ card.appendChild(el("span","pill pill-warn", t)); });
      if(x.disc.k === 0.5 && !x.pl){
        var rr = pupilByName(x.ученик) || {};
        card.appendChild(el("p","col-hint","Скидка 50% подставлена: начал " +
          (rr["старт"] ? fmtShort(rr["старт"]) : "недавно") + ", оплат ещё нет. " +
          "Если он платил раньше мимо кабинета — сними скидку."));
      }

      var form = el("div","form");
      var fN = mkInp("number", "", String(x.n));
      var fP = mkInp("number", "", x.price ? String(x.price) : "");
      var fF = mkInp("number", "", x.full ? String(x.full) : "");
      var fD = mkSel(PAY_DISC.filter(function(p){ return !(p.grpOnly && x.pl); })
                             .map(function(p){ return p.name; }), x.disc.name);
      var fS = mkInp("number", "", x.sum ? String(x.sum) : "");
      form.appendChild(fld("Занятий", fN));
      if(x.pl) form.appendChild(fld(x.формат === "пара" ? "Цена занятия с ученика" : "Цена занятия", fP));
      form.appendChild(fld("Без скидки", fF));
      form.appendChild(fld("Скидка", fD));
      form.appendChild(fld("К оплате", fS));
      card.appendChild(form);

      var ta = document.createElement("textarea");
      ta.rows = 11;
      ta.className = "bill-text";
      ta.value = x.text;
      function refresh(){
        if(!x.textEdited){ x.text = billText(x); ta.value = x.text; }
        recount();
      }
      function fromFull(){ x.sum = r2(x.full * (1 - x.disc.k)); fS.value = x.sum ? String(x.sum) : ""; }
      fN.addEventListener("input", function(){
        x.n = Math.max(0, Math.round(num(fN.value)));
        if(x.pl){ x.full = r2(x.price * x.n); fF.value = x.full ? String(x.full) : ""; fromFull(); }
        refresh();
      });
      fP.addEventListener("input", function(){
        x.price = num(fP.value);
        x.full = r2(x.price * x.n); fF.value = x.full ? String(x.full) : "";
        fromFull(); refresh();
      });
      fF.addEventListener("input", function(){ x.full = num(fF.value); fromFull(); refresh(); });
      fD.addEventListener("change", function(){
        x.disc = PAY_DISC.filter(function(p){ return p.name === fD.value; })[0] || PAY_DISC[0];
        fromFull(); refresh();
      });
      fS.addEventListener("input", function(){ x.sum = num(fS.value); refresh(); });
      ta.addEventListener("input", function(){ x.text = ta.value; x.textEdited = true; });

      if(x.hint){
        var hn = el("p","col-hint", x.hint.text + " ");
        var use = el("button","link","подставить");
        use.type = "button";
        use.addEventListener("click", function(){
          x.full = x.hint.sum; fF.value = String(x.full); fromFull(); refresh();
        });
        hn.appendChild(use);
        card.appendChild(hn);
      }
      var tl = el("label");
      tl.className = "bill-tl";
      tl.appendChild(el("span", null, "Текст для родителя"));
      tl.appendChild(ta);
      card.appendChild(tl);
      if(!x.ok) card.classList.add("off");
      box.appendChild(card);
    });
    var acts = el("div","row-actions");
    acts.style.marginTop = "12px";
    var back = el("button","btn btn-ghost","Назад к выбору");
    back.addEventListener("click", function(){ billF.drafts = null; render(); });
    go.addEventListener("click", function(){ sendBills(list.filter(ready)); });
    acts.appendChild(go); acts.appendChild(back);
    box.appendChild(acts);
    box.appendChild(why);
    recount();
  }

  /* ——— шаг 3: в таблицу и в телеграм ——— */
  /* Каждый счёт — два сообщения: кому он, и следом текст для родителя.
     Шлюз отмечает «отправлен» каждому счёту отдельно, так что при сбое
     посередине ушедшие не уйдут второй раз. */
  function billItems(rows){
    return {
      items: rows.map(function(b){ return {id:b.id, messages:[billHead(b), b["текст"]]}; }),
      mark: {sheet:"Счета", field:"отправлен", value:today()}
    };
  }
  function markSent(ids){
    var day = today();
    (ids || []).forEach(function(id){ localPatch("Счета", id, {"отправлен":day}); });
    softRender();
  }
  /* повторная отправка из списка: строки уже в таблице */
  function tgBills(rows){
    return send("tg","Счета", billItems(rows)).then(function(res){ markSent(res && res.sent); }, function(e){
      if(e && e.res) markSent(e.res.sent);
      throw e;
    });
  }
  function sendBills(list){
    var rows = list.map(function(x){
      return {"id":newRowId(), "создан":today(), "ученик":x.ученик, "предмет":x.предмет,
              "формат":x.формат, "направление":x.dir, "период_с":x.per.from || "",
              "период_по":x.one ? "" : (x.per.to || ""), "период":billWhat(x),
              "занятий":String(x.n), "цена":x.price ? String(x.price) : "",
              "полная":String(r2(x.full)), "скидка":x.disc.k ? x.disc.name : "",
              "сумма":String(r2(x.sum)), "статус":"выставлен", "оплата_id":"",
              "отправлен":"", "текст":x.text};
    });
    rows.forEach(function(b){ DATA["Счета"].push(copyOf(b)); });
    billF = {open:false, fmt:billF.fmt, kind:billF.kind, ym:billF.ym, from:billF.from,
             to:billF.to, unit:billF.unit, picked:{}, drafts:null};
    billView = "open";
    render();
    toast("Счета записываю и отправляю в телеграм…");
    /* одним запросом: шлюз пишет строки, сразу шлёт в телеграм и отмечает ушедшие */
    var pl = billItems(rows);
    pl.rows = rows;
    send("bills","Счета", pl).then(function(res){
      markSent(res && res.sent);
      toast("Выставлено " + rows.length + ", ушло в телеграм");
    }).catch(function(e){
      if(keyDied(e)) return;
      if(e && e.res && e.res.added){
        markSent(e.res.sent);
        toast("Счета записаны, но в телеграм не ушли: " + e.message +
              ". Отправь ещё раз из списка счетов.");
        /* что успело уйти, шлюз отметил в таблице — перечитываем, чтобы не слать дважды */
        load().then(render).catch(function(e2){ keyDied(e2); });
        return;
      }
      toast("Счета не записались: " + e.message);
      load().then(render).catch(function(e2){ keyDied(e2); });
    });
  }

    var t = Date.parse(iso);
    if(isNaN(t)) return null;
    var key = String(t);
    var rows = DATA["Контакты"] || [];
    for(var i = rows.length - 1; i >= 0; i--){
      if(String(rows[i]["ключ"]) === key) return rows[i];
    }
    return null;

    if(c["почта"])    out.push("Почта: " + c["почта"]);

  /* ════════════════════════ нагрузка ════════════════════════
     Часы берутся из календаря «Основное расписание» через шлюз: он же привязывает
     занятие к группе или ученику тем же правилом, что задачи на ДЗ. Отменённое
     занятие удаляется из календаря — тогда его здесь просто нет. Личные события
     шлюз не отдаёт. Деньги — из «Оплат» по дате оплаты. */
  var LOAD = {rows:null, err:"", busy:false, month:""};
  var FMTS = [{k:"группа", n:"Группы"}, {k:"пара", n:"Пары"},
              {k:"индивидуально", n:"Индивидуальные"}, {k:"—", n:"Не привязано"}];

  function localToday(){ return new Date().toLocaleDateString("sv-SE", {timeZone:TZ}); }
  function isoOf(t){ return new Date(t).toISOString().slice(0, 10); }
  function addDays(iso, n){ return isoOf(dayUTC(iso) + n * 86400000); }
  function mondayOf(iso){ return addDays(iso, -((new Date(dayUTC(iso)).getUTCDay() + 6) % 7)); }
  function wdOf(iso){ return WCODES[(new Date(dayUTC(iso)).getUTCDay() + 6) % 7]; }
  function hrs(min){ return String(Math.round(min / 6) / 10).replace(".", ","); }
  function sumMin(list){ return list.reduce(function(a, x){ return a + x.min; }, 0); }
  function weekLabel(ws){
    var we = addDays(ws, 6);
    function d(iso, m){
      return new Date(dayUTC(iso)).toLocaleDateString("ru-RU",
        m ? {day:"numeric", month:"short", timeZone:"UTC"} : {day:"numeric", timeZone:"UTC"});
    }
    return ws.slice(5, 7) === we.slice(5, 7) ? d(ws) + "–" + d(we, true) : d(ws, true) + " – " + d(we, true);
  }

  function loadRange(){
    var t = localToday(), mon = mondayOf(t);
    var from = addDays(mon, -56);
    var m2 = ymAdd(t.slice(0, 7), -2) + "-01";
    if(m2 < from) from = m2;
    return {from:from, to:addDays(mon, 14)};
  }
  /* чтение без очереди записей: ничего не меняет в таблице */
  function ask(op, extra){
    var body = {action:"admin", k:key, op:op};
    Object.keys(extra || {}).forEach(function(k){ body[k] = extra[k]; });
    return fetch(HOOK, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                        body:JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res.ok) throw new Error(res.error || "шлюз не ответил");
        return res;
      });
  }
  function loadLessons(){
    if(LOAD.busy) return;
    LOAD.busy = true; LOAD.err = "";
    ask("lessons", loadRange()).then(function(res){
      LOAD.rows = (res.lessons || []).slice().sort(function(a, b){
        return (a.day + a.time).localeCompare(b.day + b.time);
      });
    }).catch(function(e){
      if(keyDied(e)) return;
      LOAD.rows = null;
      LOAD.err = e.message;
    }).then(function(){
      LOAD.busy = false;
      if(tab === "load") softRender();
    });
  }

  /* формат занятия: у группы — формат группы, у ученика — формат его поурочного направления */
  function lessonFmt(x){
    if(x.kind === "группа"){
      var g = groupByName(x.name);
      var f = g ? String(g["формат"] || "").trim() : "";
      return (f === "пара" || f === "индивидуально") ? f : "группа";
    }
    if(x.kind === "ученик"){
      var fs = dirsOf(x.name).filter(perLesson).map(function(d){ return String(d["формат"]).trim(); });
      return (fs.length && fs.every(function(f){ return f === "пара"; })) ? "пара" : "индивидуально";
    }
    return "—";
  }
  function dirFmt(d){
    var f = String(d["формат"] || "").trim();
    if(f === "пара" || f === "индивидуально" || f === "группа") return f;
    return String(d["группа"] || "").trim() ? "группа" : "—";
  }
  /* К какому формату относится оплата: по счёту, из которого она сделана,
     иначе по направлениям ученика, если формат у него один. Иначе — не разнесена. */
  function payFmt(o){
    var bill = DATA["Счета"].filter(function(b){
      return String(b["оплата_id"] || "") === String(o.id);
    })[0];
    if(bill && String(bill["формат"] || "").trim()) return dirFmt(bill);
    var fs = [];
    dirsOf(o["ученик"]).forEach(function(d){
      var f = dirFmt(d);
      if(fs.indexOf(f) < 0) fs.push(f);
    });
    if(!fs.length){
      var p = pupilByName(o["ученик"]);
      if(p && String(p["формат"] || "").trim()) fs.push(dirFmt(p));
    }
    return fs.length === 1 ? fs[0] : "—";
  }

  function numTd(txt){ return el("td","num", txt); }
  function numTh(txt){ return el("th","num", txt); }
  function tableIn(box){
    var wrap = el("div","tbl-wrap");
    var t = document.createElement("table");
    t.className = "load-t";
    wrap.appendChild(t);
    box.appendChild(wrap);
    return t;
  }

  function renderLoad(w){
    if(!LOAD.rows && !LOAD.err && !LOAD.busy) loadLessons();
    if(LOAD.err){
      var pe = el("div","panel");
      pe.appendChild(el("h3", null, "Нагрузка"));
      pe.appendChild(el("p","empty","Календарь не прочитался: " + LOAD.err));
      var again = el("button","btn","Попробовать ещё раз");
      again.addEventListener("click", function(){ LOAD.err = ""; loadLessons(); render(); });
      pe.appendChild(again);
      w.appendChild(pe);
      return;
    }
    if(!LOAD.rows){
      var pw = el("div","panel");
      pw.appendChild(el("h3", null, "Нагрузка"));
      pw.appendChild(el("p","empty","Считаю занятия из календаря «Основное расписание»…"));
      w.appendChild(pw);
      return;
    }
    var rows = LOAD.rows.map(function(x){
      var y = {}; Object.keys(x).forEach(function(k){ y[k] = x[k]; });
      y.fmt = lessonFmt(x);
      return y;
    });
    var t0 = localToday(), mon = mondayOf(t0);
    function weekRows(ws){
      var we = addDays(ws, 7);
      return rows.filter(function(x){ return x.day >= ws && x.day < we; });
    }

    /* ——— часы по неделям ——— */
    var p1 = el("div","panel");
    p1.appendChild(el("h3", null, "Часы в неделю"));
    var cur = weekRows(mon), prev = weekRows(addDays(mon, -7)), next = weekRows(addDays(mon, 7));
    var done = cur.filter(function(x){ return x.past; });
    /* среднее — по четырём последним неделям, где в календаре были занятия:
       пустые недели (каникулы, отпуск) среднее не занижают */
    var past4 = [];
    for(var i = 1; i <= 8 && past4.length < 4; i++){
      var wr = weekRows(addDays(mon, -7 * i));
      if(wr.length) past4.push(sumMin(wr));
    }
    var avg = past4.length ? past4.reduce(function(a, b){ return a + b; }, 0) / past4.length : 0;
    var stats = el("div","stats");
    stats.appendChild(statTile("Эта неделя", hrs(sumMin(cur)) + " ч",
      "проведено " + hrs(sumMin(done)) + " ч, впереди " + hrs(sumMin(cur) - sumMin(done)) + " ч · " +
      cur.length + " " + plural(cur.length, "занятие", "занятия", "занятий")));
    stats.appendChild(statTile("Прошлая неделя", hrs(sumMin(prev)) + " ч",
      prev.length + " " + plural(prev.length, "занятие", "занятия", "занятий")));
    stats.appendChild(statTile("В среднем", hrs(avg) + " ч",
      past4.length ? "за " + past4.length + " " + plural(past4.length, "прошлую неделю", "прошлые недели", "прошлых недель") +
                     " с занятиями" : "прошлых недель в календаре нет"));
    stats.appendChild(statTile("Следующая неделя", hrs(sumMin(next)) + " ч", "по календарю, план"));
    p1.appendChild(stats);

    var t1 = tableIn(p1);
    var h1 = document.createElement("thead"), hr1 = document.createElement("tr");
    hr1.appendChild(el("th", null, "Неделя"));
    hr1.appendChild(numTh("Занятий"));
    hr1.appendChild(numTh("Часов"));
    FMTS.forEach(function(f){ hr1.appendChild(numTh(f.n)); });
    h1.appendChild(hr1); t1.appendChild(h1);
    var b1 = document.createElement("tbody");
    for(var k = 1; k >= -8; k--){
      var ws = addDays(mon, 7 * k), list = weekRows(ws);
      var tr = document.createElement("tr");
      if(k === 0) tr.className = "now";
      if(k === 1) tr.className = "plan";
      tr.appendChild(el("td", null, weekLabel(ws) + (k === 0 ? " · идёт" : k === 1 ? " · план" : "")));
      tr.appendChild(numTd(String(list.length)));
      tr.appendChild(numTd(hrs(sumMin(list))));
      FMTS.forEach(function(f){
        var m = sumMin(list.filter(function(x){ return x.fmt === f.k; }));
        tr.appendChild(numTd(m ? hrs(m) : "—"));
      });
      b1.appendChild(tr);
    }
    t1.appendChild(b1);
    w.appendChild(p1);

    /* ——— деньги на час ——— */
    var ym = t0.slice(0, 7);
    var months = [ymAdd(ym, -2), ymAdd(ym, -1), ym];
    if(months.indexOf(LOAD.month) < 0) LOAD.month = ymAdd(ym, -1);
    var p2 = el("div","panel");
    p2.appendChild(el("h3", null, "Выручка на час"));
    var bar = el("div","bar"), seg = el("div","seg");
    months.forEach(function(m){
      var b = el("button", null, cap(monthName(m)));
      b.setAttribute("aria-pressed", LOAD.month === m ? "true" : "false");
      b.addEventListener("click", function(){ LOAD.month = m; render(); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    p2.appendChild(bar);
    var held = rows.filter(function(x){ return x.past && x.day.slice(0, 7) === LOAD.month; });
    var pays = DATA["Оплаты"].filter(function(o){
      return String(o["дата"] || "").trim().slice(0, 7) === LOAD.month;
    });
    var t2 = tableIn(p2);
    t2.appendChild(head(["Формат", "Часов проведено", "Оплат пришло", "На час"]));
    [].forEach.call(t2.querySelectorAll("th"), function(th, i){ if(i) th.className = "num"; });
    var b2 = document.createElement("tbody");
    var allMin = 0, allSum = 0;
    FMTS.forEach(function(f){
      var m = sumMin(held.filter(function(x){ return x.fmt === f.k; }));
      var sum = pays.filter(function(o){ return payFmt(o) === f.k; })
                    .reduce(function(a, o){ return a + num(o["сумма"]); }, 0);
      allMin += m; allSum += sum;
      if(!m && !sum) return;
      var tr = document.createElement("tr");
      tr.appendChild(el("td", null, f.n));
      tr.appendChild(numTd(m ? hrs(m) : "—"));
      tr.appendChild(numTd(sum ? rub(sum) : "—"));
      tr.appendChild(numTd(m && sum && f.k !== "—" ? rub(sum / (m / 60)) : "—"));
      b2.appendChild(tr);
    });
    var tt = document.createElement("tr");
    tt.className = "now";
    tt.appendChild(el("td", null, "Всего"));
    tt.appendChild(numTd(allMin ? hrs(allMin) : "—"));
    tt.appendChild(numTd(allSum ? rub(allSum) : "—"));
    tt.appendChild(numTd(allMin && allSum ? rub(allSum / (allMin / 60)) : "—"));
    b2.appendChild(tt);
    t2.appendChild(b2);
    var notes = ["Оплаты считаются по дате оплаты: абонемент, оплаченный в конце месяца, попадает в месяц оплаты."];
    if(LOAD.month === ym) notes.push("Месяц ещё идёт: деньги обычно приходят в начале, а часы копятся до конца — на час сейчас выходит больше, чем будет.");
    var nod = DATA["Оплаты"].filter(function(o){ return !String(o["дата"] || "").trim(); });
    if(nod.length) notes.push("Без даты " + nod.length + " " + plural(nod.length, "оплата", "оплаты", "оплат") + " на " +
      rub(nod.reduce(function(a, o){ return a + num(o["сумма"]); }, 0)) + " — " +
      plural(nod.length, "не вошла", "не вошли", "не вошли") + " ни в один месяц. Дата ставится на вкладке «Оплаты».");
    var unk = pays.filter(function(o){ return payFmt(o) === "—"; });
    if(unk.length) notes.push("Не разнесены по формату: " + unk.map(function(o){ return o["ученик"]; })
      .filter(function(n, i, a){ return a.indexOf(n) === i; }).join(", ") +
      " — у ученика несколько форматов или нет направлений, а оплата сделана не из счёта.");
    notes.forEach(function(n){ p2.appendChild(el("p","col-hint", n)); });
    w.appendChild(p2);

    /* ——— заполненность групп ——— */
    var p3 = el("div","panel");
    p3.appendChild(el("h3", null, "Заполненность групп"));
    var last4 = rows.filter(function(x){ return x.day >= addDays(mon, -28) && x.day < mon; });
    /* делим на недели, где в календаре вообще были занятия: пустая неделя — каникулы, не простой группы */
    var wk4 = 0;
    for(var j = 1; j <= 4; j++) if(weekRows(addDays(mon, -7 * j)).length) wk4++;
    var gl = DATA["Группы"].map(function(g){
      var name = String(g["название"] || "").trim();
      var n = pupilsOf(name).length, seats = seatsOf(g);
      var m = sumMin(last4.filter(function(x){ return x.kind === "группа" && x.name === name; }));
      return {name:name, n:n, seats:seats, fill:seats ? n / seats : null, week:wk4 ? m / wk4 : 0,
              fmt:String(g["формат"] || "").trim() || "группа"};
    }).filter(function(g){ return g.name; })
      .sort(function(a, b){
        if(a.fill === null) return 1;
        if(b.fill === null) return -1;
        return a.fill - b.fill;
      });
    var free = gl.filter(function(g){ return g.fmt === "группа" && g.seats > g.n; })
                 .reduce(function(a, g){ return a + g.seats - g.n; }, 0);
    p3.appendChild(el("p","col-hint", "Свободных мест в группах: " + free +
      ". Сверху самые пустые — туда в первую очередь вести новых учеников."));
    var t3 = tableIn(p3);
    t3.appendChild(head(["Группа", "Учеников", "Мест", "Заполнено", "Часов в неделю"]));
    [].forEach.call(t3.querySelectorAll("th"), function(th, i){ if(i) th.className = "num"; });
    var b3 = document.createElement("tbody");
    gl.forEach(function(g){
      var tr = document.createElement("tr");
      tr.appendChild(el("td", null, g.name + (g.fmt !== "группа" ? " · " + g.fmt : "")));
      tr.appendChild(numTd(String(g.n)));
      tr.appendChild(numTd(g.seats ? String(g.seats) : "—"));
      var fc = numTd(g.fill === null ? "—" : Math.round(g.fill * 100) + "%");
      if(g.fill !== null && (g.fill < 0.5 || g.fill > 1)){
        var pw2 = el("span","pill pill-warn", g.fill > 1 ? "больше мест" : (g.n ? "полупустая" : "пустая"));
        pw2.style.marginLeft = "8px";
        fc.appendChild(pw2);
      }
      tr.appendChild(fc);
      tr.appendChild(numTd(g.week ? hrs(g.week) : "нет в календаре"));
      b3.appendChild(tr);
    });
    t3.appendChild(b3);
    p3.appendChild(el("p","col-hint", "Часы — среднее за четыре прошлые недели, пустые недели не в счёт. " +
      "Мест, если в карточке группы не указано, считается " + SEATS_FMT["группа"] + ". «Нет в календаре» — событие " +
      "не привязалось к группе: проверь дни и время группы или название события."));
    w.appendChild(p3);

    /* ——— не привязались ——— */
    var loose = rows.filter(function(x){ return x.fmt === "—" && x.day >= addDays(mon, -28) && x.day < addDays(mon, 14); });
    if(loose.length){
      var p4 = el("div","panel");
      p4.appendChild(el("h3", null, "Не привязались к базе"));
      var by = {}, order = [];
      loose.forEach(function(x){
        if(!by[x.title]){ by[x.title] = {n:0, slots:[]}; order.push(x.title); }
        by[x.title].n++;
        var sl = wdOf(x.day) + " " + x.time;
        if(by[x.title].slots.indexOf(sl) < 0) by[x.title].slots.push(sl);
      });
      order.forEach(function(tl){
        var r = el("p", null, "«" + tl + "» — " + by[tl].slots.join(", ") + " · " + by[tl].n + " " +
          plural(by[tl].n, "раз", "раза", "раз") + " за 6 недель");
        p4.appendChild(r);
      });
      p4.appendChild(el("p","col-hint", "Эти часы считаются в «Не привязано». Впиши эти дни и время ученику " +
        "или группе в кабинете — занятие привяжется и уйдёт в свой формат."));
      w.appendChild(p4);
    }

    var p5 = el("div","panel");
    p5.appendChild(el("h3", null, "Как считается"));
    ["Занятия — события календаря «Основное расписание». Отменённое занятие удаляй из календаря, тогда оно не считается.",
     "События на весь день, окна «Свободно» и личные дела (к базе не привязались и на урок не похожи) пропускаются.",
     "Прошедшее событие считается проведённым, будущее — планом. Длительность — по времени события.",
     "Группа находится по дню и времени, индивидуальное — по дням в направлении ученика, иначе по названию события."
    ].forEach(function(n){ p5.appendChild(el("p","col-hint", n)); });
    w.appendChild(p5);
  }

  /* ——— старт ——— */

  function boot(){
    if(!key){ renderGate(); return; }
    app.innerHTML = "";
    var g = el("div","gate");
    g.appendChild(el("h2", null, "Загружаю…"));
    app.appendChild(g);
    Promise.all([load(), loadCalendar()]).then(function(res){
      render();
    }).catch(function(e){
      key = "";
      try{ localStorage.removeItem(KEY_STORE); }catch(e2){}
      renderGate("Ключ не подошёл. Попробуйте ещё раз.");
    });
  }

  boot();
})();
</script>
