        "статус":"учится", "заметка":"", "перерыв_с":"", "перерыв_по":"", "окончание":""
      };
      var dir = {
        "ученик":nm, "предмет":fSub.value, "формат":fFmt.value,
        "группа":ind ? "" : fGrp.value, "абонемент":ind ? "" : fAb.value,
        "цена_занятия":ind ? fPr.value : "", "минуты":ind ? fMin.value : "", "заметка":""
      };
      /* строка появляется сразу — и второй клик уже упрётся в проверку на тёзку */
      localAdd("Ученики", copyOf(pupil));
      localAdd("Направления", copyOf(dir));
      fName.value = ""; fKl.value = ""; fAb.value = ""; fPar.value = "";
      fPr.value = ""; fMin.value = ""; fSt.value = today();
      render();
      bg(send("add","Ученики",{row:pupil}).then(function(){
        return send("add","Направления",{row:dir});
      }).then(function(){
        return load().then(render);
      }), "Ученик добавлен");
    });
    p.appendChild(form);
    p.appendChild(el("p","col-hint",
      "С даты старта ученик автоматически считается учащимся. Перерыв, окончание, " +
      "дискорд, источник и заметку можно дописать в карточке."));
    w.appendChild(p);

    var t = el("div","panel");
    t.appendChild(el("h3", null, "Ученики"));
    var all = DATA["Ученики"].slice().sort(function(a,b){
      return Number(a["класс"]) - Number(b["класс"]) || String(a["ученик"]).localeCompare(String(b["ученик"]));
    });
    if(!all.length){ t.appendChild(el("p","empty","Пока пусто.")); w.appendChild(t); return; }
    t.appendChild(el("p","col-hint","Нажми на строку — справа выедет карточка ученика."));

    /* ——— панель фильтров ———
       имена нарочно с приставкой flt: выше в этой же функции живут поля формы
       нового ученика, и одинаковые имена молча перетирали бы их */
    var flt = el("div","filters");
    var fltQ  = mkInp("text", "имя, родитель, заметка", pupilF.q);
    var fltSu = mkFlt(usedVals(DATA["Направления"], "предмет"), pupilF.subj);
    var fltKl = mkFlt(usedVals(all, "класс", true), pupilF.klass);
    var fltFm = mkFlt(DIR_FMT, pupilF.fmt);
    var fltGr = mkFlt(usedVals(DATA["Направления"], "группа"), pupilF.group);
    var fltSt = mkFlt(PUPIL_ST, pupilF.st);
    var qw = fld("Поиск", fltQ); qw.className = "q";
    [qw, fld("Предмет", fltSu), fld("Класс", fltKl), fld("Формат", fltFm),
     fld("Группа", fltGr), fld("Статус", fltSt)].forEach(function(l){ flt.appendChild(l); });
    var tail = el("div","tail");
    var cnt = el("span","cnt");
    var reset = el("button","btn btn-ghost btn-sm","Сбросить");
    reset.addEventListener("click", function(){
      pupilF = {q:"", subj:"", klass:"", fmt:"", group:"", st:""};
      fltQ.value = ""; fltSu.value = ""; fltKl.value = "";
      fltFm.value = ""; fltGr.value = ""; fltSt.value = "";
      fill();
    });
    tail.appendChild(cnt); tail.appendChild(reset);
    flt.appendChild(tail);
    fltQ.addEventListener("input",  function(){ pupilF.q     = fltQ.value.trim(); fill(); });
    fltSu.addEventListener("change",function(){ pupilF.subj  = fltSu.value; fill(); });
    fltKl.addEventListener("change",function(){ pupilF.klass = fltKl.value; fill(); });
    fltFm.addEventListener("change",function(){ pupilF.fmt   = fltFm.value; fill(); });
    fltGr.addEventListener("change",function(){ pupilF.group = fltGr.value; fill(); });
    fltSt.addEventListener("change",function(){ pupilF.st    = fltSt.value; fill(); });
    t.appendChild(flt);

    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    tb.appendChild(head(["Ученик","Кл","Предмет","Формат","Группа","Цена","Оплачено","Родитель","Discord"]));
    var body = document.createElement("tbody");
    function fill(){
    body.innerHTML = "";
    var rows = all.filter(pupilMatch);
    cnt.textContent = pupilFOn() ? ("показано " + rows.length + " из " + all.length)
                                 : ("всего " + all.length);
    if(!rows.length){
      var tr0 = document.createElement("tr");
      var td0 = el("td","empty","Под фильтры никто не подошёл.");
      td0.colSpan = 9; tr0.appendChild(td0); body.appendChild(tr0);
      return;
    }
    rows.forEach(function(row){
      var tr = document.createElement("tr");
      tr.className = "clickable" + (String(pupilOpen) === String(row.id) ? " sel" : "");
      tr.addEventListener("click", function(){ pupilOpen = row.id; pupilEdit = false; payEdit = null; dirEdit = null; dirAdd = false; groupOpen = null; render(); });
      var nm = el("td");
      nm.appendChild(el("strong", null, row["ученик"]));
      var stt = pupilState(row);
      if(stt.k !== "учится"){
        var sp = el("span", stateClass(stt.k), stt.text);
        sp.style.marginLeft = "8px"; sp.style.fontSize = "11.5px";
        nm.appendChild(sp);
      }
      if(row["заметка"]){
        var z = el("div","muted", row["заметка"]); z.style.fontSize = "12px"; nm.appendChild(z);
      }
      tr.appendChild(nm);
      tr.appendChild(el("td","muted", row["класс"]));
      /* по строке на каждое направление — предметы, форматы, группы и цены
         стоят друг под другом и читаются по строкам */
      var ds = dirsOf(row["ученик"]);
      function col(cls, fn, pill){
        var td = el("td", pill ? null : cls);
        if(!ds.length){ td.appendChild(el("span","muted","—")); return td; }
        ds.forEach(function(d, i){
          var v = fn(d);
          var line = pill ? el("span","pill", v || "—") : el("div", null, v || "—");
          if(pill) line.style.display = "block";
          if(i) line.style.marginTop = "4px";
          if(!v && pill) line.className = "muted";
          td.appendChild(line);
        });
        return td;
      }
      tr.appendChild(col("muted", function(d){ return d["предмет"]; }));
      tr.appendChild(col(null,    function(d){ return d["формат"]; }));
      tr.appendChild(col("muted", function(d){ return isInd(d) ? "" : d["группа"]; }));
      tr.appendChild(col(null, dirPrice, true));
      var pd = el("td");
      var sum = paidBy(row["ученик"]);
      pd.appendChild(el("span", sum ? "pill" : "pill pill-warn", sum ? String(sum) : "нет оплат"));
      tr.appendChild(pd);
      tr.appendChild(el("td","muted", row["родитель"]));
      var dc = discordText(row["discord"]);
      tr.appendChild(el("td", dc ? null : "muted", dc || "—"));
      body.appendChild(tr);
    });
    }
    fill();
    tb.appendChild(body); tw.appendChild(tb); t.appendChild(tw);
    w.appendChild(t);

    if(pupilOpen) renderPupilDrawer(w, pupilOpen);
  }

  function closeDrawer(){
    /* в карточке могла остаться правка, которая ждала своей секунды */
    if(flushSave){ var fs = flushSave; flushSave = null; fs(); }
    if(!pupilOpen && !groupOpen) return;
    pupilOpen = null; pupilEdit = false; payEdit = null; dirEdit = null; dirAdd = false; groupOpen = null; render();
  }

  /* Поля одного направления: предмет, формат и цена того формата. */
  function dirFields(d){
    var f = {};
    f.subj = mkSel(DIR_SUBJ, d["предмет"] || "математика");
    f.fmt  = mkSel(DIR_FMT,  d["формат"]  || "группа");
    f.grp  = mkSel(groupOpts(d["группа"]), d["группа"] || "");
    f.ab   = mkInp("number", "по группе", d["абонемент"]);
    f.pr   = mkInp("number", "цена", d["цена_занятия"]);
    f.min  = mkInp("number", "мин",  d["минуты"]);
    var form = el("div","form"), wr = {};
    [["Предмет",f.subj],["Формат",f.fmt],["Группа",f.grp],["Абонемент",f.ab],
     ["Цена за занятие",f.pr],["Длительность, мин",f.min]].forEach(function(p){
      var l = fld(p[0], p[1]); wr[p[0]] = l; form.appendChild(l);
    });
    /* группа — месячный абонемент; пара и индивидуальное — цена за занятие.
       У пары группа всё равно бывает: в листе «Группы» пара — такая же строка. */
    function sync(){
      var fm = f.fmt.value;
      var grp = fm !== "индивидуально";
      var per = fm === "пара" || fm === "индивидуально";
      wr["Группа"].style.display = grp ? "" : "none";
      wr["Абонемент"].style.display = per ? "none" : "";
      wr["Цена за занятие"].style.display = per ? "" : "none";
      wr["Длительность, мин"].style.display = per ? "" : "none";
      wr["Цена за занятие"].querySelector("span").textContent =
        fm === "пара" ? "Цена занятия с ученика" : "Цена за занятие";
      hintFromGroup();
    }
    /* цена и длительность выбранной группы видны прямо в подписи поля */
    function hintFromGroup(){
      var g = groupByName(f.grp.value);
      var price = g ? String(g["абонемент"] || "").trim() : "";
      var mins  = g ? String(g["минуты"] || "").trim() : "";
      f.ab.placeholder = price ? "по группе " + price : "цена группы не задана";
      wr["Абонемент"].querySelector("span").textContent =
        price ? "Абонемент · по группе " + price : "Абонемент";
      if(g && mins && !f.min.value) f.min.placeholder = "по группе " + mins;
    }
    f.fmt.addEventListener("change", sync);
    f.grp.addEventListener("change", hintFromGroup);
    hintFromGroup();
    sync();
    f.form = form;
    f.row = function(name){
      var fm = f.fmt.value;
      var per = fm === "пара" || fm === "индивидуально";
      return {"ученик":name, "предмет":f.subj.value, "формат":fm,
              "группа":fm === "индивидуально" ? "" : f.grp.value,
              "абонемент":per ? "" : f.ab.value,
              "цена_занятия":per ? f.pr.value : "", "минуты":per ? f.min.value : "",
              "заметка":d["заметка"] || ""};
    };
    return f;
  }

  function dirSection(r){
    var s = el("div","dsec");
    s.appendChild(el("div","dsec-h","Направления"));
    var ds = dirsOf(r["ученик"]);
    if(!ds.length && !dirAdd)
      s.appendChild(el("p","empty","Ни одного предмета не записано."));
    ds.forEach(function(d){
      var box = el("div","dir");
      if(String(dirEdit) === String(d.id)){
        var f = dirFields(d);
        box.appendChild(f.form);
        var acts = el("div","row-actions"); acts.style.marginTop = "10px";
        var ok = el("button","btn btn-sm","Сохранить");
        ok.addEventListener("click", function(){
          var row = f.row(r["ученик"]);
          localPatch("Направления", d.id, row);
          dirEdit = null; render();
          bg(send("update","Направления",{id:d.id, row:row}), "Направление сохранено");
        });
        var no = el("button","btn btn-ghost btn-sm","Отмена");
        no.addEventListener("click", function(){ dirEdit = null; render(); });
        var del = el("button","link","удалить");
        var armed = false;
        del.addEventListener("click", function(){
          if(!armed){ armed = true; del.textContent = "точно удалить?"; return; }
          localDrop("Направления", d.id);
          dirEdit = null; render();
          bg(send("delete","Направления",{id:d.id}), "Направление убрано");
        });
        acts.appendChild(ok); acts.appendChild(no); acts.appendChild(del);
        box.appendChild(acts);
      } else {
        var line = el("div","dir-line");
        line.appendChild(el("strong", null, d["предмет"]));
        line.appendChild(el("span","muted",
          String(d["формат"] || "") + (d["группа"] ? " · " + d["группа"] : "")));
        var pr = dirPrice(d);
        line.appendChild(el("span", pr ? "pill" : "pill pill-warn", pr || "цена не указана"));
        if(!isInd(d) && dirOwnPrice(d) && groupByName(d["группа"]))
          line.appendChild(el("span","muted","своя цена"));
        if(d.__tmp){
          line.appendChild(el("span","muted","пишу…"));
        } else {
          var ed = el("button","link","правка");
          ed.addEventListener("click", function(){ dirEdit = d.id; dirAdd = false; render(); });
          line.appendChild(ed);
        }
        box.appendChild(line);
      }
      s.appendChild(box);
    });
    if(dirAdd){
      var nf = dirFields({});
      var nbox = el("div","dir");
      nbox.appendChild(nf.form);
      var na = el("div","row-actions"); na.style.marginTop = "10px";
      var nok = el("button","btn btn-sm","Записать предмет");
      nok.addEventListener("click", function(){
        var row = nf.row(r["ученик"]);
        var same = dirsOf(r["ученик"]).some(function(x){
          return String(x["предмет"] || "").trim() === row["предмет"] &&
                 String(x["формат"]  || "").trim() === row["формат"];
        });
        if(same){ toast("Такое направление уже есть"); return; }
        localAdd("Направления", copyOf(row));
        dirAdd = false; render();
        bg(send("add","Направления",{row:row}).then(function(){
          return load().then(render);
        }), "Предмет добавлен");
      });
      var nno = el("button","btn btn-ghost btn-sm","Отмена");
      nno.addEventListener("click", function(){ dirAdd = false; render(); });
      na.appendChild(nok); na.appendChild(nno);
      nbox.appendChild(na);
      s.appendChild(nbox);
    } else {
      var addb = el("button","btn btn-ghost btn-sm","Добавить предмет");
      addb.style.marginTop = "12px";
      addb.addEventListener("click", function(){ dirAdd = true; dirEdit = null; render(); });
      s.appendChild(addb);
    }
    s.appendChild(el("p","col-hint",
      "Один предмет — одна строка со своим форматом и ценой. Математика в группе и " +
      "химия индивидуально живут отдельно."));
    return s;
  }

  function renderPupilDrawer(w, id){
    var r = pupilById(id);
    if(!r){ pupilOpen = null; return; }

    var back = el("div","dback");
    back.addEventListener("click", closeDrawer);
    w.appendChild(back);

    var d = el("aside","drawer");
    var hd = el("div","dhead");
    hd.appendChild(el("div","t","Карточка ученика"));
    var x = el("button","dx","Закрыть ✕");
    x.addEventListener("click", closeDrawer);
    hd.appendChild(x);
    d.appendChild(hd);

    var b = el("div","dbody");
    var sum = paidBy(r["ученик"]);

    var h = el("div", null, r["ученик"]);
    h.style.font = "600 24px/1.2 var(--display)";
    b.appendChild(h);
    var meta = el("p","muted",
      [r["класс"] ? r["класс"] + " класс" : ""]
        .concat(dirsOf(r["ученик"]).map(function(x){
          return x["предмет"] + " " + x["формат"] + (x["группа"] ? " " + x["группа"] : "");
        }))
        .filter(Boolean).join(" · "));
    meta.style.margin = "4px 0 12px";
    b.appendChild(meta);

    var tags = el("div","card-tags");
    tags.style.margin = "0 0 16px";
    priceText(r).forEach(function(x){ tags.appendChild(el("span","pill", x)); });
    tags.appendChild(el("span", sum ? "pill" : "pill pill-warn",
      sum ? "оплачено " + sum : "нет оплат"));
    var stt = pupilState(r);
    tags.appendChild(el("span", stateClass(stt.k), stt.text));
    b.appendChild(tags);

    if(!pupilEdit){
      var view = el("div","kv");
      [["Класс", r["класс"]], ["Родитель", r["родитель"]],
       ["Источник", r["источник"]],
       ["Старт", r["старт"]], ["Окончание", r["окончание"]]]
        .concat(CONTACTS.filter(function(c){ return ctValue(r, c.k); })
                        .map(function(c){ return [c.name, ctValue(r, c.k)]; }))
        .forEach(function(pair){
          var cell = el("div");
          cell.appendChild(el("div","k", pair[0]));
          var val = String(pair[1] === undefined || pair[1] === null ? "" : pair[1]).trim();
          cell.appendChild(el("div", val ? "v" : "v dim", val || "не указано"));
          view.appendChild(cell);
        });
      b.appendChild(view);

      var nb = el("div","kv kv-note");
      var ncell = el("div");
      ncell.appendChild(el("div","k","Заметка"));
      var nv = String(r["заметка"] || "").trim();
      ncell.appendChild(el("div", nv ? "v" : "v dim", nv || "пусто"));
      nb.appendChild(ncell);
      b.appendChild(nb);

      var edit = el("button","btn","Редактировать карточку");
      edit.style.marginTop = "18px";
      edit.addEventListener("click", function(){ pupilEdit = true; render(); });
      b.appendChild(edit);
    } else {
      var f = {};
      f["ученик"]    = mkInp("text", "", r["ученик"]);
      f["класс"]     = mkSel([""].concat(PUPIL_KL), r["класс"]);
      f["родитель"]  = mkInp("text", "", r["родитель"]);
      f["источник"]  = mkSource(r["источник"]);
      f["старт"]     = mkInp("date", "", r["старт"]);
      f["окончание"] = mkInp("date", "", r["окончание"]);
      var form2 = el("div","form");
      [["Ученик","ученик"],["Класс","класс"],["Родитель","родитель"],
       ["Источник","источник"],["Старт","старт"],["Окончание","окончание"]]
        .forEach(function(pair){
          /* источник — не просто поле, внутри кнопки: label им мешает */
          form2.appendChild(pair[1] === "источник"
            ? fldBox(pair[0], f[pair[1]], true)
            : fld(pair[0], f[pair[1]]));
        });
      b.appendChild(form2);

      /* ——— контакты ———
         На экране только то, что заполнено. Остальное прячется за «+»:
         у кого-то есть только телеграм родителя, у кого-то дискорд и телефон. */
      var CT = {};
      CONTACTS.forEach(function(c){
        var v = ctValue(r, c.k);
        if(v) CT[c.k] = v;
      });
      var ctWrap = el("div","cts");
      function drawCts(){
        ctWrap.innerHTML = "";
        var head = el("div","cts-head");
        head.appendChild(el("span","cts-t","Контакты"));
        var left = CONTACTS.filter(function(c){ return CT[c.k] === undefined; });
        if(left.length){
          var sel = mkSel(left.map(function(c){ return c.name; }), left[0].name);
          var add = el("button","btn btn-sm","Добавить");
          add.type = "button";
          add.addEventListener("click", function(){
            var pick = left.filter(function(c){ return c.name === sel.value; })[0];
            if(pick){ CT[pick.k] = ""; drawCts(); }
          });
          head.appendChild(sel);
          head.appendChild(add);
        }
        ctWrap.appendChild(head);
        var any = false;
        CONTACTS.forEach(function(c){
          if(CT[c.k] === undefined) return;
          any = true;
          var row = el("div","ct-row");
          row.appendChild(el("span","ct-name", c.name));
          var i = mkInp("text", c.ph, CT[c.k]);
          i.addEventListener("input", function(){ CT[c.k] = i.value; });
          row.appendChild(i);
          var x = el("button","ct-x","✕");
          x.type = "button";
          x.title = "убрать";
          x.addEventListener("click", function(){ delete CT[c.k]; drawCts(); });
          row.appendChild(x);
          ctWrap.appendChild(row);
        });
        if(!any) ctWrap.appendChild(el("p","col-hint","Ни одного контакта не записано."));
      }
      b.appendChild(el("p","col-hint",
        "Предметы, форматы и цены правятся ниже, в направлениях. Статус считается сам: " +
        "до даты старта — «начнёт», после даты окончания — «ушёл». " +
        "Отдельно его выставлять не нужно."));
      drawCts();
      b.appendChild(ctWrap);

      var note = document.createElement("textarea");
      note.rows = 2;
      note.placeholder = "чем занимаемся, о чём помнить";
      note.value = r["заметка"] || "";
      var nl = el("label");
      nl.style.display = "grid"; nl.style.gap = "4px";
      nl.style.fontSize = "12.5px"; nl.style.color = "var(--muted)";
      nl.style.marginTop = "10px";
      nl.appendChild(el("span", null, "Заметка"));
      nl.appendChild(note);
      b.appendChild(nl);

      var acts = el("div","row-actions");
      acts.style.marginTop = "14px";
      var save = el("button","btn","Сохранить");
      var cancel = el("button","btn btn-ghost","Отмена");
      save.addEventListener("click", function(){
        var nm = f["ученик"].value.trim();
        if(!nm){ toast("Имя не может быть пустым"); return; }
        var patch = {};
        Object.keys(f).forEach(function(k){ patch[k] = f[k].value; });
        patch["ученик"] = nm;
        patch["заметка"] = note.value;
        /* убранный контакт стирается в таблице, а не просто исчезает с экрана */
        CONTACTS.forEach(function(c){
          patch[c.k] = CT[c.k] === undefined ? "" : String(CT[c.k]).trim();
        });
        patch["статус"] = pupilState(patch).k;
        var was = r["ученик"], renamed = was !== nm;
        var moves = renamed ? dirsOf(was) : [];
        localPatch("Ученики", r.id, patch);
        moves.forEach(function(x){ localPatch("Направления", x.id, {"ученик":nm}); });
        pupilEdit = false;
        render();
        /* при переименовании тянем за собой направления — они привязаны по имени */
        bg(send("update","Ученики",{id:r.id, row:patch}).then(function(){
          return moves.reduce(function(chain, x){
            return chain.then(function(){
              return send("update","Направления",{id:x.id, row:{"ученик":nm}});
            });
          }, Promise.resolve());
        }), "Сохранено");
      });
      cancel.addEventListener("click", function(){ pupilEdit = false; render(); });
      acts.appendChild(save); acts.appendChild(cancel);
      /* Удаление ученика: два нажатия, вместе с ним уходят его направления.
         Оплаты остаются — это история, её стирать нельзя. */
      var drop = el("button","link","Удалить ученика");
      var armedP = false;
      drop.addEventListener("click", function(){
        var mineDirs = dirsOf(r["ученик"]);
        if(!armedP){
          armedP = true;
          drop.textContent = "точно удалить" +
            (mineDirs.length ? " вместе с направлениями (" + mineDirs.length + ")?" : "?");
          return;
        }
        var paid = paidBy(r["ученик"]);
        localDrop("Ученики", r.id);
        mineDirs.forEach(function(x){ localDrop("Направления", x.id); });
        pupilOpen = null; pupilEdit = false; dirEdit = null; dirAdd = false;
        render();
        bg(send("delete","Ученики",{id:r.id}).then(function(){
          return mineDirs.reduce(function(chain, x){
            return chain.then(function(){ return send("delete","Направления",{id:x.id}); });
          }, Promise.resolve());
        }), paid ? "Ученик удалён, оплаты остались в истории" : "Ученик удалён");
      });
      acts.appendChild(drop);
      b.appendChild(acts);
      b.appendChild(el("p","col-hint",
        "Оплаты привязаны к имени. Если переименовать ученика, старые оплаты останутся " +
        "на прежнем имени — их придётся поправить в таблице. При удалении ученика оплаты " +
        "тоже остаются: это история."));
    }

    b.appendChild(dirSection(r));

    var ps = el("div","dsec");
    ps.appendChild(el("div","dsec-h","Оплаты ученика"));
    var mine = DATA["Оплаты"].filter(function(o){ return o["ученик"] === r["ученик"]; }).reverse();
    if(!mine.length){
      ps.appendChild(el("p","empty","Оплат пока нет."));
    } else {
      ps.appendChild(payTable(mine, false));
      ps.appendChild(el("p","col-hint", "Всего оплачено: " + sum +
        ". «Правка» открывает строку: можно поменять дату, сумму и чек или удалить оплату."));
    }
    var pf = el("div","form");
    pf.style.marginTop = "12px";
    var pday = mkInp("date", "", today());
    var ms = monthSum(r["ученик"]);
    /* Две суммы, а не одна: скидка считается от полной, а платят итог.
       Оплатили полтора месяца — вписываете полную сумму за них, а не абонемент. */
    var full = mkInp("number", ms ? String(ms) : "сколько без скидки", ms ? String(ms) : "");
    var disc = mkSel(PAY_DISC.map(function(x){ return x.name; }), PAY_DISC[0].name);
    var amt  = mkInp("number", ms ? String(ms) : "", ms ? String(ms) : "");
    var chek = mkSel(["нет","да"], "нет");
    var padd = el("button","btn","Записать оплату");
    var hasGrp = dirsOf(r["ученик"]).some(function(x){ return !isInd(x); });
    function discOf(){
      return PAY_DISC.filter(function(x){ return x.name === disc.value; })[0] || PAY_DISC[0];
    }
    var calc = el("p","col-hint","");
    function recount(){
      var base = parseFloat(String(full.value).replace(",", "."));
      var x = discOf();
      if(!(base > 0)){
        calc.textContent = x.k ? "Впишите сумму без скидки — от неё считается скидка." : "";
        return;
      }
      var out = Math.round(base * (1 - x.k) * 100) / 100;
      amt.value = String(out);
      calc.textContent = x.k ? (Math.round(x.k * 100) + "% от " + base + " — к оплате " + out)
                             : "";
    }
    disc.addEventListener("change", function(){
      var x = discOf();
      if(x.grpOnly && !hasGrp){
        toast("Эта скидка только на групповой абонемент");
        disc.value = PAY_DISC[0].name;
      }
      recount();
    });
    full.addEventListener("change", recount);
    [["Дата",pday],["Сумма без скидки",full],["Скидка",disc],["К оплате",amt],["Чек",chek]]
      .forEach(function(pair){ pf.appendChild(fld(pair[0], pair[1])); });
    pf.appendChild(padd);
    padd.addEventListener("click", function(){
      if(!amt.value){ toast("Сумма пустая"); return; }
      var row = {"дата":pday.value || today(), "ученик":r["ученик"],
                 "сумма":amt.value, "чек":chek.value, "заметка":discOf().note};
      var copy = {}; Object.keys(row).forEach(function(k){ copy[k] = row[k]; });
      localAdd("Оплаты", copy);
      render();
      bg(send("add","Оплаты",{row:row}).then(function(){
        return load().then(render);
      }), "Оплата записана");
    });
    ps.appendChild(pf);
    ps.appendChild(calc);
    ps.appendChild(el("p","col-hint",
      "Скидка считается от суммы без скидки — впишите туда то, что клиент платит " +
      "за весь период: остаток месяца, месяц, два. «К оплате» можно поправить руками, " +
      "если нужно округлить."));
    b.appendChild(ps);

    d.appendChild(b);
    w.appendChild(d);
  }

  function mark(v){
    var td = el("td");
    var ok = String(v).toLowerCase() === "да";
    td.appendChild(el("span", ok ? "pill" : "pill pill-warn", ok ? "есть" : "нет"));
    return td;
  }

  /* ——— Оплаты ——— */

  /* Таблица оплат с правкой и удалением. withPupil — показывать колонку «Ученик». */
  function payTable(rows, withPupil){
    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    var cols = withPupil ? ["Дата","Ученик","Сумма","Чек",""] : ["Дата","Сумма","Чек",""];
    tb.appendChild(head(cols));
    var body = document.createElement("tbody");
    rows.forEach(function(row){
      var tr = document.createElement("tr");
      if(String(payEdit) === String(row.id)){
        var fd = mkInp("date", "", row["дата"]);
        var fs = mkInp("number", "", row["сумма"]);
        var fc = mkSel(["нет","да"], String(row["чек"] || "нет"));
        fd.style.minWidth = "152px"; fs.style.minWidth = "88px"; fc.style.minWidth = "84px";
        var c1 = el("td"); c1.appendChild(fd); tr.appendChild(c1);
        if(withPupil) tr.appendChild(el("td","muted", row["ученик"]));
        var c2 = el("td"); c2.appendChild(fs); tr.appendChild(c2);
        var c3 = el("td"); c3.appendChild(fc); tr.appendChild(c3);
        var c4 = el("td");
        var acts = el("div","row-actions");
        var ok = el("button","btn btn-sm","Сохранить");
        var no = el("button","btn btn-ghost btn-sm","Отмена");
        var del = el("button","link link-warn","удалить");
        var armed = false;
        ok.addEventListener("click", function(){
          var patch = {"дата":fd.value, "сумма":fs.value, "чек":fc.value};
          localPatch("Оплаты", row.id, patch);
          payEdit = null;
          render();
          bg(send("update","Оплаты",{id:row.id, row:patch}), "Оплата исправлена");
        });
        no.addEventListener("click", function(){ payEdit = null; render(); });
        del.addEventListener("click", function(){
          if(!armed){
            armed = true;
            del.textContent = "точно удалить?";
            setTimeout(function(){ armed = false; del.textContent = "удалить"; }, 4000);
            return;
          }
          localDrop("Оплаты", row.id);
          payEdit = null;
          render();
          bg(send("delete","Оплаты",{id:row.id}), "Оплата удалена");
        });
        acts.appendChild(ok); acts.appendChild(no); acts.appendChild(del);
        c4.appendChild(acts); tr.appendChild(c4);
      } else {
        tr.appendChild(el("td","muted", row["дата"] || "—"));
        if(withPupil) tr.appendChild(el("td", null, row["ученик"]));
        tr.appendChild(el("td", null, row["сумма"]));
        tr.appendChild(mark(row["чек"]));
        var c5 = el("td");
        if(row.__tmp){
          c5.appendChild(el("span","muted","пишу…"));
        } else {
          var ed = el("button","link","правка");
          ed.addEventListener("click", function(){ payEdit = row.id; render(); });
          c5.appendChild(ed);
        }
        tr.appendChild(c5);
      }
      body.appendChild(tr);
    });
    tb.appendChild(body); tw.appendChild(tb);
    return tw;
  }


  function renderPay(w){
    var p = el("div","panel");
    p.appendChild(el("h3", null, "Новая оплата"));
    var form = el("div","form");
    var day = document.createElement("input"); day.type="date"; day.value = today();
    var who = document.createElement("input"); who.type="text"; who.placeholder="ученик";
    var sum = document.createElement("input"); sum.type="number"; sum.placeholder="260";
    var chek = document.createElement("select");
    ["да","нет"].forEach(function(s){ var o=document.createElement("option"); o.value=s; o.textContent=s; chek.appendChild(o); });
    var add = el("button","btn","Записать");
    [["Дата",day],["Ученик",who],["Сумма",sum],["Чек",chek]].forEach(function(pair){
      var l = el("label"); l.appendChild(el("span",null,pair[0])); l.appendChild(pair[1]); form.appendChild(l);
    });
    form.appendChild(add);
    add.addEventListener("click", function(){
      if(!who.value.trim()) return;
      var row = {"дата":day.value || today(), "ученик":who.value.trim(),
                 "сумма":sum.value, "чек":chek.value};
      var copy = {}; Object.keys(row).forEach(function(k){ copy[k] = row[k]; });
      localAdd("Оплаты", copy);
      render();
      bg(send("add","Оплаты",{row:row}).then(function(){
        return load().then(render);
      }), "Оплата записана");
    });
    p.appendChild(form);
    w.appendChild(p);

    var t = el("div","panel");
    t.appendChild(el("h3", null, "Оплаты"));
    var rows = DATA["Оплаты"].slice().reverse();
    if(!rows.length){ t.appendChild(el("p","empty","Пока пусто.")); w.appendChild(t); return; }
    t.appendChild(payTable(rows, true));
    t.appendChild(el("p","col-hint",
      "«Правка» открывает строку: можно поменять дату, сумму и чек или удалить оплату."));
    w.appendChild(t);
  }

  /* ——— Календарь ——— */

  // контакты со страницы Насти: одна строка на пробное, ключ - время начала в миллисекундах
  function contactFor(iso){
    var t = Date.parse(iso);
    if(isNaN(t)) return null;
    var key = String(t);
    var rows = DATA["Контакты"] || [];
    for(var i = rows.length - 1; i >= 0; i--){
      if(String(rows[i]["ключ"]) === key) return rows[i];
    }
    return null;
  }
  function contactLines(iso){
    var c = contactFor(iso);
    if(!c) return [];
    var out = [];
    if(c["телеграм"]) out.push("Телеграм: " + c["телеграм"]);
    if(c["вайбер"])   out.push("Вайбер: " + c["вайбер"]);
    if(c["почта"])    out.push("Почта: " + c["почта"]);
    return out;
  }

  function renderCal(w){
    var busyList = CAL.filter(function(c){ return !c.free; });
    var freeList = CAL.filter(function(c){ return c.free; });

    var b = el("div","panel");
    b.appendChild(el("h3", null, "Назначенные пробные"));
    if(!busyList.length) b.appendChild(el("p","empty","Пока никого не записали."));
    busyList.forEach(function(c){
      var r = el("div"); r.style.padding = "8px 0"; r.style.borderTop = "1px solid var(--line)";
      var t1 = el("div", null, c.title); t1.style.fontWeight = "600"; t1.style.color = "var(--grape)";
      var t2 = el("div","muted", c.when); t2.style.fontSize = "13px";
      r.appendChild(t1); r.appendChild(t2);
      contactLines(c.iso).forEach(function(line){
        var ct = el("div", null, line);
        ct.style.fontSize = "13px";
        r.appendChild(ct);
      });
      if(c.meet){
        var a = document.createElement("a");
        a.href = c.meet; a.target = "_blank"; a.rel = "noopener";
        a.className = "muted"; a.style.fontSize = "12px"; a.textContent = "ссылка на встречу";
        r.appendChild(a);
      }
      b.appendChild(r);
    });
    w.appendChild(b);

    var f = el("div","panel");
    f.appendChild(el("h3", null, "Свободные окна"));
    if(!freeList.length) f.appendChild(el("p","empty","Окон нет - поставьте их в календарь «Окна для пробного»."));
    var byDay = {}, order = [];
    freeList.forEach(function(c){
      var d = c.when.split(",")[0] + "," + c.when.split(",")[1];
      if(!byDay[d]){ byDay[d] = []; order.push(d); }
      byDay[d].push(c.when.split(", ").pop());
    });
    order.forEach(function(d){
      var r = el("div"); r.style.padding = "7px 0"; r.style.borderTop = "1px solid var(--line)";
      r.style.display = "flex"; r.style.gap = "14px"; r.style.flexWrap = "wrap";
      var a = el("div","muted", d); a.style.minWidth = "150px"; a.style.fontSize = "13px";
      var bb = el("div","", byDay[d].join(", ")); bb.style.fontFamily = "var(--mono)"; bb.style.fontSize = "13px";
      r.appendChild(a); r.appendChild(bb);
      f.appendChild(r);
    });
    w.appendChild(f);
  }

  /* ——— старт ——— */

  function boot(){
    if(!key){ renderGate(); return; }
    app.innerHTML = "";
    var g = el("div","gate");
    g.appendChild(el("h2", null, "Загружаю…"));
    app.appendChild(g);
    Promise.all([load(), loadCalendar()]).then(function(res){
      render();
    }).catch(function(e){
      key = "";
      try{ localStorage.removeItem(KEY_STORE); }catch(e2){}
      renderGate("Ключ не подошёл. Попробуйте ещё раз.");
    });
  }

  boot();
})();
</script>
