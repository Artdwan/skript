<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АртТич · Кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme:dark;
    --paper:#0E1210; --card:#161B18; --ink:#E8EEE9; --muted:#93A29A; --line:#28302C;
    --accent:#6FC493; --accent-ink:#0B120E; --accent-soft:#18271F;
    --warn:#E4A863; --warn-soft:#2C2015;
    --grape:#B79CE8; --grape-soft:#231E32; --banana:#E0B84A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.4);
    --radius:14px;
    --sans:"Golos Text","Segoe UI",system-ui,sans-serif;
    --display:"Commissioner","Golos Text",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  /* светлая тема остаётся про запас: <html data-theme="light"> */
  :root[data-theme="light"]{
    color-scheme:light;
    --paper:#F6F6F2; --card:#FFFFFF; --ink:#151C17; --muted:#5D6B60; --line:#DDE3DA;
    --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E7F0E9;
    --warn:#9A5B14; --warn-soft:#FBEEDC;
    --grape:#6A4C9C; --grape-soft:#EFE9F8; --banana:#B8860B;
    --shadow:0 1px 2px rgba(21,28,23,.06), 0 8px 24px rgba(21,28,23,.05);
  }

  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 18px 64px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:var(--display);font-size:clamp(26px,4vw,38px);line-height:1.08;margin:6px 0 4px}
  .lede{color:var(--muted);margin:0 0 22px;max-width:62ch}

  /* вход */
  .gate{max-width:460px;margin:14vh auto;background:var(--card);border:1px solid var(--line);
        border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px;display:grid;gap:14px}
  .gate h2{font-family:var(--display);font-size:22px;margin:0}
  .gate p{margin:0;color:var(--muted);font-size:14px}
  input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
    width:100%;font:400 15px/1.35 var(--sans);padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{font:600 14px/1 var(--sans);padding:11px 16px;border-radius:10px;border:1px solid var(--accent);
       background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-ghost{background:none;color:var(--ink);border-color:var(--line)}
  .btn-sm{font-size:13px;padding:8px 12px}

  /* вкладки */
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
  .tab{font:600 14px/1 var(--sans);padding:10px 14px;border-radius:999px;border:1px solid var(--line);
       background:var(--card);color:var(--ink);cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tab .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:6px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
         box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .panel h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--muted);margin:0 0 12px;font-weight:500}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
     color:var(--muted);padding:0 10px 8px 0;white-space:nowrap}
  td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
  tr:hover td{background:var(--accent-soft)}
  tr.clickable{cursor:pointer}
  tr.sel td{background:var(--accent-soft)}

  /* выдвижная панель ученика */
  .dback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;
         transition:opacity .18s ease}
  .dback.on{opacity:1}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--card);
          border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;
          transform:translateX(102%);transition:transform .22s ease;
          box-shadow:-20px 0 46px rgba(0,0,0,.45)}
  .drawer.on{transform:none}
  .dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;
         padding:16px 18px;border-bottom:1px solid var(--line)}
  .dhead .t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--muted)}
  .dx{background:none;border:1px solid var(--line);border-radius:9px;color:var(--ink);
      font:500 15px/1 var(--sans);padding:8px 11px;cursor:pointer}
  .dx:hover{background:var(--accent-soft)}
  .dbody{overflow-y:auto;padding:18px;flex:1 1 auto}
  .dsec{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
  .dsec-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--muted);margin-bottom:12px}
  .drawer .form{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kv{display:grid;gap:14px 22px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .kv .k{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kv .v{font-size:15px;margin-top:5px;word-break:break-word}
  .kv .v.dim{color:var(--muted)}
  .kv-note{margin-top:16px;grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}

  .pill{display:inline-block;font:500 12px/1 var(--sans);padding:5px 9px;border-radius:999px;
        background:var(--accent-soft);color:var(--ink);white-space:nowrap}
  .pill-warn{background:var(--warn-soft);color:var(--warn)}
  .pill-grape{background:var(--grape-soft);color:var(--grape)}
  .muted{color:var(--muted)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);
        text-decoration:underline;cursor:pointer}
  .link-warn{color:var(--warn)}

  .funnel{display:flex;gap:8px;flex-wrap:wrap}
  .step{flex:1 1 120px;background:var(--accent-soft);border-radius:10px;padding:12px}
  .step .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .step .v{font-family:var(--display);font-size:24px;font-weight:600}
  .step .c{font-family:var(--mono);font-size:11px;color:var(--accent)}

  /* доска воронки */
  .board{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;align-items:flex-start}
  .col{flex:0 0 214px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
       box-shadow:var(--shadow);padding:11px 11px 14px;min-height:130px}
  .col.arch{background:var(--paper)}
  .col.over{outline:2px dashed var(--accent);outline-offset:2px}
  .col-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .col-name{font:600 13.5px/1.25 var(--sans)}
  .col-n{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .col-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .col-conv{font-family:var(--mono);font-size:11.5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
            display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
  .col-conv b{color:var(--accent);font-weight:600}
  .col-conv .low{color:var(--warn)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px}
  .col.arch .card{background:var(--card)}
  .card[draggable="true"]{cursor:grab}
  .card.drag{opacity:.4}
  .card-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .card-nick{font:600 14px/1.2 var(--sans);word-break:break-word}
  .card-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .card-goal{font-size:12.5px;margin-top:4px}
  .card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tag{font:500 11px/1 var(--sans);padding:4px 7px;border-radius:999px;background:var(--accent-soft);color:var(--ink);
       border:0;cursor:pointer;white-space:nowrap}
  .tag-warn{background:var(--warn-soft);color:var(--warn)}
  .tag-grape{background:var(--grape-soft);color:var(--grape)}
  .card-nav{display:flex;gap:6px;margin-top:8px;align-items:center}
  .nav-b{font:600 13px/1 var(--mono);border:1px solid var(--line);background:var(--card);color:var(--ink);
         border-radius:8px;padding:5px 9px;cursor:pointer}
  .nav-b:disabled{opacity:.3;cursor:default}
  .nav-x{margin-left:auto;font-size:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{font:500 12.5px/1 var(--sans);padding:8px 12px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

  .form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
  .form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);
         color:var(--paper);padding:11px 16px;border-radius:999px;font-size:14px;opacity:0;
         transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.on{opacity:1}
  .empty{color:var(--muted);font-size:14px}
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var HOOK = "https://script.google.com/macros/s/AKfycbw1vjhO0JHHthjVSKltxRDmn7K8-iVC12hIaVpLloN_oV4xS-Fpax8Nwo2tb0wDPSW2/exec";
  var CAL_ID = "b43eb3d7776bfcea6809d656966accc9e36cc6cdcf0ea8b0c5b093a514086e67@group.calendar.google.com";
  var CAL_KEY = "AIzaSyD5lIW-GkzisYTUVQEbi8iS2x7UiIk8SRs";
  var TZ = "Europe/Minsk";
  var KEY_STORE = "arttich-admin-key";

  /* Этапы воронки. Порядок важен: по нему считаются конверсии. */
  var STAGES = [
    {k:"директ",  name:"Написали в Директ",      hint:"старт воронки"},
    {k:"запрос",  name:"Назвали предмет и класс", hint:"поняли, что нужно"},
    {k:"цена",    name:"Получили цену",          hint:"отправили условия"},
    {k:"записан", name:"Записались на пробное",  hint:"есть дата и время"},
    {k:"пробное", name:"Пришли на пробное",      hint:"диагностика прошла"},
    {k:"оплатил", name:"Оплатили",               hint:"первый платёж"}
  ];
  var ARCH = {k:"архив", name:"Архив", hint:"отказ или тишина"};
  var KEYS = STAGES.map(function(s){ return s.k; });
  var REASONS = ["","дорого","нет времени","передумал","ушёл к другим","не тот класс","молчит"];

  var key = "";
  try{ key = localStorage.getItem(KEY_STORE) || ""; }catch(e){ key = ""; }

  var DATA = {"Лиды":[], "Группы":[], "Ученики":[], "Оплаты":[], "Задачи":[], "Контакты":[]};
  var CAL = [];
  var tab = "today";
  var busy = false;
  var period = "all";
  var closedOnly = false;
  var dragId = null;
  var pupilOpen = null;
  var pupilEdit = false;

  var app = document.getElementById("app");

  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && pupilOpen) closeDrawer();
  });

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }
  function today(){ return new Date().toISOString().slice(0,10); }
  function fmtDay(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString("ru-RU", {weekday:"short", day:"numeric", month:"long", timeZone:TZ});
  }

  /* ——— обмен с посредником ——— */

  function load(){
    if(!key) return Promise.resolve(false);
    return fetch(HOOK + "?action=data&k=" + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.ok) throw new Error(d.error || "не приняло ключ");
        Object.keys(DATA).forEach(function(n){ DATA[n] = d.sheets[n] || []; });
        return true;
      });
  }
  function send(op, sheet, payload){
    if(busy) return Promise.resolve();
    busy = true;
    var body = {action:"admin", k:key, op:op, sheet:sheet};
    if(payload.id) body.id = payload.id;
    if(payload.row) body.row = payload.row;
    if(payload.rows) body.rows = payload.rows;
    return fetch(HOOK, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); })
      .then(function(res){
        busy = false;
        if(!res.ok) throw new Error(res.error || "не записалось");
        return res;
      })
      .catch(function(err){ busy = false; throw err; });
  }
  function afterWrite(msg){
    return load().then(function(){ render(); toast(msg); })
                 .catch(function(e){ toast("Ошибка: " + e.message); });
  }

  function loadCalendar(){
    var now = new Date();
    var till = new Date(now.getTime() + 21*24*3600*1000);
    var u = "https://www.googleapis.com/calendar/v3/calendars/" + encodeURIComponent(CAL_ID) +
      "/events?key=" + CAL_KEY + "&singleEvents=true&orderBy=startTime&maxResults=150" +
      "&timeMin=" + encodeURIComponent(now.toISOString()) +
      "&timeMax=" + encodeURIComponent(till.toISOString());
    return fetch(u).then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){
        CAL = (d.items || []).filter(function(e){ return e.start && e.start.dateTime; })
          .map(function(e){
            var dt = new Date(e.start.dateTime);
            return {
              title: String(e.summary || ""),
              when: dt.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long",timeZone:TZ}) +
                    ", " + dt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",timeZone:TZ}),
              iso: e.start.dateTime,
              meet: e.hangoutLink || "",
              free: /^\s*своб/i.test(String(e.summary || ""))
            };
          });
      }).catch(function(){ CAL = []; });
  }

  /* ——— экран входа ——— */

  function renderGate(err){
    app.innerHTML = "";
    var g = el("div","gate");
    g.appendChild(el("h2", null, "АртТич · Кабинет"));
    g.appendChild(el("p", null, "Введите ключ доступа. Он сохранится в этом браузере, спрашивать больше не буду."));
    var inp = document.createElement("input");
    inp.type = "password"; inp.placeholder = "ключ"; inp.autocomplete = "off";
    g.appendChild(inp);
    if(err) { var e2 = el("p", null, err); e2.style.color = "var(--warn)"; g.appendChild(e2); }
    var b = el("button","btn","Войти");
    function go(){
      var v = inp.value.trim();
      if(!v) return;
      key = v;
      try{ localStorage.setItem(KEY_STORE, key); }catch(e){}
      boot();
    }
    b.addEventListener("click", go);
    inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter") go(); });
    g.appendChild(b);
    app.appendChild(g);
    inp.focus();
  }

  /* ——— вкладки ——— */

  var TABS = [
    {id:"today",  name:"Сегодня"},
    {id:"funnel", name:"Воронка"},
    {id:"leads",  name:"Лиды"},
    {id:"groups", name:"Группы"},
    {id:"pupils", name:"Ученики"},
    {id:"pay",    name:"Оплаты"},
    {id:"cal",    name:"Календарь"}
  ];

  function render(){
    app.innerHTML = "";
    var w = el("div","wrap");

    w.appendChild(el("div","eyebrow","АртТич · внутренний кабинет"));
    var h = el("h1", null, "Кабинет");
    w.appendChild(h);
    w.appendChild(el("p","lede","Лиды, ученики, оплаты и задачи. Данные лежат в вашей таблице, страница только показывает их."));

    var nav = el("nav","tabs");
    TABS.forEach(function(t){
      var b = el("button","tab");
      b.appendChild(document.createTextNode(t.name));
      var n = countFor(t.id);
      if(n !== null){ var s = el("span","n", n); b.appendChild(s); }
      b.setAttribute("aria-selected", tab === t.id ? "true" : "false");
      b.addEventListener("click", function(){ tab = t.id; pupilOpen = null; pupilEdit = false; render(); });
      nav.appendChild(b);
    });
    var rb = el("button","tab","Обновить");
    rb.addEventListener("click", function(){
      Promise.all([load(), loadCalendar()]).then(function(){ render(); toast("Обновлено"); });
    });
    nav.appendChild(rb);
    w.appendChild(nav);

    if(tab === "today")  renderToday(w);
    if(tab === "funnel") renderFunnel(w);
    if(tab === "leads")  renderLeads(w);
    if(tab === "groups") renderGroups(w);
    if(tab === "pupils") renderPupils(w);
    if(tab === "pay")    renderPay(w);
    if(tab === "cal")    renderCal(w);

    app.appendChild(w);
  }

  function countFor(id){
    if(id === "today")  return openTasks().length || null;
    if(id === "funnel") return DATA["Лиды"].filter(function(l){ return colOf(l) !== ARCH.k; }).length || null;
    if(id === "leads")  return DATA["Лиды"].length || null;
    if(id === "groups") return DATA["Группы"].length || null;
    if(id === "pupils") return DATA["Ученики"].filter(function(p){ return p["статус"] !== "ушёл"; }).length || null;
    if(id === "pay")    return null;
    if(id === "cal")    return CAL.filter(function(c){ return !c.free; }).length || null;
    return null;
  }

  function openTasks(){
    return DATA["Задачи"].filter(function(t){ return String(t["сделано"]).toLowerCase() !== "да"; });
  }

  /* ——— воронка: счёт ——— */

  function idxOf(k){ return KEYS.indexOf(String(k || "").trim()); }

  /* в какой колонке лид стоит сейчас */
  function colOf(l){
    var s = String(l["статус"] || "").trim();
    if(s === ARCH.k) return ARCH.k;
    var i = idxOf(s);
    return i >= 0 ? KEYS[i] : KEYS[0];
  }
  /* до какого этапа лид дошёл за всю жизнь (для конверсий) */
  function peak(l){
    var a = idxOf(l["этап"]);
    var b = idxOf(l["статус"]);
    return Math.max(a, b, 0);
  }
  function closed(l){ var c = colOf(l); return c === ARCH.k || c === "оплатил"; }

  function inPeriod(l){
    if(period === "all") return true;
    var d = String(l["дата"] || "").slice(0,10);
    if(!d) return true;
    if(period === "month") return d.slice(0,7) === today().slice(0,7);
    return d >= new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  }
  function cohort(){
    return DATA["Лиды"].filter(function(l){
      return inPeriod(l) && (!closedOnly || closed(l));
    });
  }
  /* сколько лидов дошли до этапа i или дальше */
  function reached(i, base){
    base = base || cohort();
    return base.filter(function(l){ return peak(l) >= i; }).length;
  }
  function pct(a, b){ return b ? Math.round(a / b * 100) : null; }

  function daysSince(l){
    var d = String(l["обновлён"] || l["дата"] || "").slice(0,10);
    if(!d) return null;
    var t = Date.parse(d);
    if(isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 864e5);
  }

  function moveLead(l, k){
    var patch = {"статус":k, "обновлён":today()};
    if(k !== ARCH.k){
      var i = idxOf(k);
      if(i > peak(l)) patch["этап"] = k;
      patch["ход"] = (k === "оплатил") ? "" : "он";
    }
    send("update","Лиды",{id:l.id, row:patch})
      .then(function(){ return afterWrite(k === ARCH.k ? "В архив" : "Перенёс"); })
      .catch(function(e){ toast("Ошибка: " + e.message); });
  }
  function patchLead(l, row, msg){
    send("update","Лиды",{id:l.id, row:row})
      .then(function(){ return afterWrite(msg || "Готово"); })
      .catch(function(e){ toast("Ошибка: " + e.message); });
  }

  /* ——— Воронка ——— */

  function renderFunnel(w){
    var base = cohort();

    /* настройки счёта */
    var bar = el("div","bar");
    var seg = el("div","seg");
    [["all","за всё время"],["month","этот месяц"],["30","30 дней"]].forEach(function(o){
      var b = el("button", null, o[1]);
      b.setAttribute("aria-pressed", period === o[0] ? "true" : "false");
      b.addEventListener("click", function(){ period = o[0]; render(); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    var seg2 = el("div","seg");
    [[false,"все лиды"],[true,"только закрытые"]].forEach(function(o){
      var b = el("button", null, o[1]);
      b.setAttribute("aria-pressed", closedOnly === o[0] ? "true" : "false");
      b.addEventListener("click", function(){ closedOnly = o[0]; render(); });
      seg2.appendChild(b);
    });
    bar.appendChild(seg2);
    var tot = pct(reached(KEYS.length - 1, base), reached(0, base));
    var sum = el("div","muted");
    sum.style.fontSize = "13px";
    sum.textContent = "Лидов в расчёте: " + reached(0, base) +
      " · дошли до оплаты: " + reached(KEYS.length - 1, base) +
      (tot === null ? "" : " · сквозная конверсия " + tot + "%");
    bar.appendChild(sum);
    w.appendChild(bar);

    /* доска */
    var board = el("div","board");
    var cols = STAGES.concat([ARCH]);
    cols.forEach(function(st, ci){
      var isArch = st.k === ARCH.k;
      var c = el("div", isArch ? "col arch" : "col");

      var top = el("div","col-top");
      top.appendChild(el("div","col-name", st.name));
      var here = base.filter(function(l){ return colOf(l) === st.k; });
      top.appendChild(el("div","col-n", String(here.length)));
      c.appendChild(top);
      c.appendChild(el("div","col-hint", st.hint));

      if(!isArch){
        var cv = el("div","col-conv");
        var r = reached(ci, base);
        cv.appendChild(el("span", null, "дошли " + r));
        if(ci > 0){
          var p2 = pct(r, reached(ci - 1, base));
          var s2 = el("b", (p2 !== null && p2 < 40) ? "low" : null, p2 === null ? "—" : p2 + "%");
          cv.appendChild(s2);
        } else {
          cv.appendChild(el("b", null, "100%"));
        }
        c.appendChild(cv);
      }

      /* приём карточек мышью */
      c.addEventListener("dragover", function(ev){ ev.preventDefault(); c.classList.add("over"); });
      c.addEventListener("dragleave", function(){ c.classList.remove("over"); });
      c.addEventListener("drop", function(ev){
        ev.preventDefault(); c.classList.remove("over");
        var l = DATA["Лиды"].filter(function(x){ return String(x.id) === String(dragId); })[0];
        dragId = null;
        if(l && colOf(l) !== st.k) moveLead(l, st.k);
      });

      here.sort(function(a,b){ return (daysSince(b) || 0) - (daysSince(a) || 0); })
          .forEach(function(l){ c.appendChild(cardFor(l, ci, cols)); });

      if(!here.length){
        var e = el("div","empty","пусто"); e.style.marginTop = "10px"; e.style.fontSize = "12.5px";
        c.appendChild(e);
      }
      board.appendChild(c);
    });
    w.appendChild(board);

    w.appendChild(sourceTable(base));

    var note = el("div","panel");
    note.appendChild(el("h3", null, "Как считается"));
    var ul = document.createElement("div");
    ul.style.fontSize = "14px";
    [
      "Число справа в шапке колонки - сколько лидов стоит в ней прямо сейчас.",
      "«Дошли N» - сколько лидов хоть раз доходили до этого этапа, даже если потом ушли дальше или в архив. Именно это и есть воронка.",
      "Процент - «дошли» этого этапа делить на «дошли» предыдущего. Он никогда не бывает больше 100%: нельзя прийти на пробное, не записавшись.",
      "Сквозная конверсия - оплатившие делить на всех лидов периода.",
      "«Только закрытые» убирает из счёта тех, кто ещё в работе. Они тянут проценты вниз, потому что просто не дошли ещё.",
      "Красным процент горит, если этап теряет больше 60% - там дырка."
    ].forEach(function(t){
      var r = el("div", null, "— " + t);
      r.style.padding = "3px 0";
      ul.appendChild(r);
    });
    note.appendChild(ul);
    w.appendChild(note);
  }

  function cardFor(l, ci, cols){
    var c = el("div","card");
    var isArch = colOf(l) === ARCH.k;
    if(!isArch){
      c.setAttribute("draggable","true");
      c.addEventListener("dragstart", function(){ dragId = l.id; c.classList.add("drag"); });
      c.addEventListener("dragend", function(){ c.classList.remove("drag"); });
    }

    var top = el("div","card-top");
    top.appendChild(el("div","card-nick", l["ник"] || "без ника"));
    c.appendChild(top);

    var meta = [];
    if(l["класс"]) meta.push(l["класс"] + " класс");
    if(l["предмет"]) meta.push(l["предмет"]);
    if(meta.length) c.appendChild(el("div","card-meta", meta.join(" · ")));
    if(l["цель"]) c.appendChild(el("div","card-goal", l["цель"]));
    if(l["пробное"]) c.appendChild(el("div","card-meta", "пробное: " + l["пробное"]));

    var tags = el("div","card-tags");
    if(!isArch){
      var mine = String(l["ход"] || "") !== "он";
      var t1 = el("button", mine ? "tag tag-warn" : "tag", mine ? "ход за нами" : "ждём ответ");
      t1.title = "переключить, чей ход";
      t1.addEventListener("click", function(){
        patchLead(l, {"ход": mine ? "он" : "мы", "обновлён": today()}, "Отметил");
      });
      tags.appendChild(t1);
      var d = daysSince(l);
      if(d !== null && d >= 2 && !mine) tags.appendChild(el("span","tag tag-grape","молчит " + d + " дн"));
    }
    if(l["источник"]) tags.appendChild(el("span","tag", l["источник"]));
    if(tags.children.length) c.appendChild(tags);

    if(isArch){
      var sel = document.createElement("select");
      sel.style.marginTop = "8px"; sel.style.fontSize = "12.5px"; sel.style.padding = "6px 8px";
      REASONS.forEach(function(r){
        var o = document.createElement("option"); o.value = r; o.textContent = r || "причина?";
        if(String(l["причина"] || "") === r) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function(){ patchLead(l, {"причина": sel.value}, "Записал причину"); });
      c.appendChild(sel);
      var back = el("button","link","вернуть в работу");
      back.style.marginTop = "6px";
      back.addEventListener("click", function(){
        moveLead(l, KEYS[Math.max(peak(l), 0)]);
      });
      c.appendChild(back);
      return c;
    }

    var nav = el("div","card-nav");
    var bk = el("button","nav-b","←");
    bk.disabled = ci === 0;
    bk.title = "на шаг назад";
    bk.addEventListener("click", function(){ moveLead(l, KEYS[ci - 1]); });
    var fw = el("button","nav-b","→");
    fw.disabled = ci >= KEYS.length - 1;
    fw.title = "на шаг вперёд";
    fw.addEventListener("click", function(){ moveLead(l, KEYS[ci + 1]); });
    nav.appendChild(bk); nav.appendChild(fw);
    var x = el("button","link link-warn nav-x","в архив");
    x.addEventListener("click", function(){ moveLead(l, ARCH.k); });
    nav.appendChild(x);
    c.appendChild(nav);
    return c;
  }

  function sourceTable(base){
    var p = el("div","panel");
    p.appendChild(el("h3", null, "Откуда приходят и что из этого выходит"));
    var by = {}, order = [];
    base.forEach(function(l){
      var s = String(l["источник"] || "не указан");
      if(!by[s]){ by[s] = []; order.push(s); }
      by[s].push(l);
    });
    if(!order.length){ p.appendChild(el("p","empty","Пока не из чего считать.")); return p; }
    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    tb.appendChild(head(["Источник","Лидов","До цены","Записались","Пришли","Оплатили","Конверсия"]));
    var body = document.createElement("tbody");
    order.sort(function(a,b){ return by[b].length - by[a].length; }).forEach(function(s){
      var rows = by[s];
      var tr = document.createElement("tr");
      tr.appendChild(el("td", null, s));
      tr.appendChild(el("td", null, String(rows.length)));
      [2,3,4,5].forEach(function(i){
        tr.appendChild(el("td","muted", String(reached(i, rows))));
      });
      var p2 = pct(reached(5, rows), rows.length);
      var td = el("td");
      td.appendChild(el("span", (p2 || 0) >= 20 ? "pill" : "pill pill-warn", (p2 === null ? "—" : p2 + "%")));
      tr.appendChild(td);
      body.appendChild(tr);
    });
    tb.appendChild(body); tw.appendChild(tb); p.appendChild(tw);
    return p;
  }

  function groupOpts(cur){
    var list = [""];
    DATA["Группы"].forEach(function(g){
      var n = String(g["название"] || "");
      if(n && list.indexOf(n) < 0) list.push(n);
    });
    if(cur && list.indexOf(String(cur)) < 0) list.push(String(cur));
    return list;
  }
  function mkInp(type, ph, val){
    var i = document.createElement("input");
    i.type = type;
    if(ph) i.placeholder = ph;
    if(val !== undefined && val !== null) i.value = val;
    return i;
  }
  function mkSel(opts, val){
    var s = document.createElement("select");
    var list = opts.slice();
    if(val && list.indexOf(String(val)) < 0) list.push(String(val));
    list.forEach(function(o){
      var e = document.createElement("option");
      e.value = o; e.textContent = o || "—";
      s.appendChild(e);
    });
    if(val !== undefined && val !== null) s.value = String(val);
    return s;
  }

    var add   = el("button","btn","Добавить");
    [["Ученик",fName],["Класс",fKl],["Предмет",fSub],["Формат",fFmt],
     ["Группа",fGrp],["Абонемент",fAb],["Родитель",fPar]].forEach(function(pair){
      form.appendChild(fld(pair[0], pair[1]));
    });
    form.appendChild(add);
    add.addEventListener("click", function(){
      var nm = fName.value.trim();
      if(!nm){ toast("Без имени не запишу"); return; }
      var dup = DATA["Ученики"].filter(function(r){
        return String(r["ученик"]).toLowerCase() === nm.toLowerCase();
      });
      if(dup.length){ toast("Такой ученик уже есть"); return; }
      send("add","Ученики",{row:{
        "ученик":nm, "класс":fKl.value.trim(), "предмет":fSub.value, "формат":fFmt.value,
        "группа":fGrp.value, "абонемент":fAb.value, "родитель":fPar.value.trim(),
        "источник":"", "старт":today(), "discord":"нет", "holst":"нет",
        "статус":"учится", "заметка":""
      }}).then(function(){
        fName.value = ""; fKl.value = ""; fAb.value = ""; fPar.value = "";
        return afterWrite("Ученик добавлен");
      }).catch(function(e){ toast("Ошибка: " + e.message); });
    });
    p.appendChild(form);
    p.appendChild(el("p","col-hint",
      "Старт поставлю сегодняшним числом, статус — «учится». Источник, заметку и остальное " +
      "можно дописать в карточке."));
    w.appendChild(p);

    var t = el("div","panel");
    t.appendChild(el("h3", null, "Ученики"));
    var rows = DATA["Ученики"].slice().sort(function(a,b){
      return Number(a["класс"]) - Number(b["класс"]) || String(a["ученик"]).localeCompare(String(b["ученик"]));
    });
    if(!rows.length){ t.appendChild(el("p","empty","Пока пусто.")); w.appendChild(t); return; }
    t.appendChild(el("p","col-hint","Нажми на строку — справа выедет карточка ученика."));
    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    tb.appendChild(head(["Ученик","Кл","Предмет","Формат","Группа","Абонемент","Оплачено","Родитель","Discord"]));
    var body = document.createElement("tbody");
    rows.forEach(function(row){
      var tr = document.createElement("tr");
      tr.className = "clickable" + (String(pupilOpen) === String(row.id) ? " sel" : "");
      tr.addEventListener("click", function(){ pupilOpen = row.id; pupilEdit = false; render(); });
      var nm = el("td");
      nm.appendChild(el("strong", null, row["ученик"]));
      if(row["заметка"]){
        var z = el("div","muted", row["заметка"]); z.style.fontSize = "12px"; nm.appendChild(z);
      }
      tr.appendChild(nm);
      tr.appendChild(el("td","muted", row["класс"]));
      tr.appendChild(el("td","muted", row["предмет"]));
      tr.appendChild(el("td", null, row["формат"]));
      tr.appendChild(el("td","muted", row["группа"]));
      var ab = el("td");
      var unit = row["формат"] === "группа" ? " в месяц" : " за занятие";
      ab.appendChild(el("span","pill", row["абонемент"] + unit));
      tr.appendChild(ab);
      var pd = el("td");
      var sum = paidBy(row["ученик"]);
      pd.appendChild(el("span", sum ? "pill" : "pill pill-warn", sum ? String(sum) : "нет оплат"));
      tr.appendChild(pd);
      tr.appendChild(el("td","muted", row["родитель"]));
      tr.appendChild(mark(row["discord"]));
      body.appendChild(tr);
    });
    tb.appendChild(body); tw.appendChild(tb); t.appendChild(tw);
    w.appendChild(t);

    if(pupilOpen) renderPupilDrawer(w, pupilOpen);
  }

  function closeDrawer(){
    if(!pupilOpen) return;
    pupilOpen = null; pupilEdit = false; render();
  }

  function renderPupilDrawer(w, id){
    var r = pupilById(id);
    if(!r){ pupilOpen = null; return; }

    var back = el("div","dback");
    back.addEventListener("click", closeDrawer);
    w.appendChild(back);

    var d = el("aside","drawer");
    var hd = el("div","dhead");
    hd.appendChild(el("div","t","Карточка ученика"));
    var x = el("button","dx","Закрыть ✕");
    x.addEventListener("click", closeDrawer);
    hd.appendChild(x);
    d.appendChild(hd);

    var b = el("div","dbody");
    var sum = paidBy(r["ученик"]);

    var h = el("div", null, r["ученик"]);
    h.style.font = "600 24px/1.2 var(--display)";
    b.appendChild(h);
    var meta = el("p","muted",
      [r["класс"] ? r["класс"] + " класс" : "", r["предмет"], r["формат"], r["группа"]]
        .filter(Boolean).join(" · "));
    meta.style.margin = "4px 0 12px";
    b.appendChild(meta);

    var tags = el("div","card-tags");
    tags.style.margin = "0 0 16px";
    var unit = r["формат"] === "группа" ? " в месяц" : " за занятие";
    tags.appendChild(el("span","pill", "абонемент " + r["абонемент"] + unit));
    tags.appendChild(el("span", sum ? "pill" : "pill pill-warn",
      sum ? "оплачено " + sum : "нет оплат"));
    if(String(r["статус"]) && String(r["статус"]) !== "учится")
      tags.appendChild(el("span","pill pill-warn", r["статус"]));
    b.appendChild(tags);

    if(!pupilEdit){
      var view = el("div","kv");
      [["Класс", r["класс"]], ["Предмет", r["предмет"]], ["Формат", r["формат"]],
       ["Группа", r["группа"]], ["Абонемент", r["абонемент"]], ["Родитель", r["родитель"]],
       ["Источник", r["источник"]], ["Старт", r["старт"]],
       ["Discord", r["discord"] || "нет"], ["Статус", r["статус"] || "учится"]]
        .forEach(function(pair){
          var cell = el("div");
          cell.appendChild(el("div","k", pair[0]));
          var val = String(pair[1] === undefined || pair[1] === null ? "" : pair[1]).trim();
          cell.appendChild(el("div", val ? "v" : "v dim", val || "не указано"));
          view.appendChild(cell);
        });
      b.appendChild(view);

      var nb = el("div","kv kv-note");
      var ncell = el("div");
      ncell.appendChild(el("div","k","Заметка"));
      var nv = String(r["заметка"] || "").trim();
      ncell.appendChild(el("div", nv ? "v" : "v dim", nv || "пусто"));
      nb.appendChild(ncell);
      b.appendChild(nb);

      var edit = el("button","btn","Редактировать карточку");
      edit.style.marginTop = "18px";
      edit.addEventListener("click", function(){ pupilEdit = true; render(); });
      b.appendChild(edit);
    } else {
      var f = {};
      f["ученик"]    = mkInp("text", "", r["ученик"]);
      f["класс"]     = mkInp("text", "", r["класс"]);
      f["предмет"]   = mkSel(PUPIL_SUBJ, r["предмет"]);
      f["формат"]    = mkSel(PUPIL_FMT, r["формат"]);
      f["группа"]    = mkSel(groupOpts(r["группа"]), r["группа"]);
      f["абонемент"] = mkInp("number", "", r["абонемент"]);
      f["родитель"]  = mkInp("text", "", r["родитель"]);
      f["источник"]  = mkInp("text", "реклама, сарафан…", r["источник"]);
      f["старт"]     = mkInp("text", "2025-09-01", r["старт"]);
      f["discord"]   = mkSel(["нет","да"], r["discord"] || "нет");
      f["статус"]    = mkSel(PUPIL_ST, r["статус"] || "учится");
      var form2 = el("div","form");
      [["Ученик","ученик"],["Класс","класс"],["Предмет","предмет"],["Формат","формат"],
       ["Группа","группа"],["Абонемент","абонемент"],["Родитель","родитель"],
       ["Источник","источник"],["Старт","старт"],["Discord","discord"],["Статус","статус"]]
        .forEach(function(pair){ form2.appendChild(fld(pair[0], f[pair[1]])); });
      b.appendChild(form2);

      var note = document.createElement("textarea");
      note.rows = 2;
      note.placeholder = "чем занимаемся, о чём помнить";
      note.value = r["заметка"] || "";
      var nl = el("label");
      nl.style.display = "grid"; nl.style.gap = "4px";
      nl.style.fontSize = "12.5px"; nl.style.color = "var(--muted)";
      nl.style.marginTop = "10px";
      nl.appendChild(el("span", null, "Заметка"));
      nl.appendChild(note);
      b.appendChild(nl);

      var acts = el("div","row-actions");
      acts.style.marginTop = "14px";
      var save = el("button","btn","Сохранить");
      var cancel = el("button","btn btn-ghost","Отмена");
      save.addEventListener("click", function(){
        if(!f["ученик"].value.trim()){ toast("Имя не может быть пустым"); return; }
        var patch = {};
        Object.keys(f).forEach(function(k){ patch[k] = f[k].value; });
        patch["ученик"] = patch["ученик"].trim();
        patch["заметка"] = note.value;
        send("update","Ученики",{id:r.id, row:patch})
          .then(function(){ pupilEdit = false; return afterWrite("Сохранено"); })
          .catch(function(e){ toast("Ошибка: " + e.message); });
      });
      cancel.addEventListener("click", function(){ pupilEdit = false; render(); });
      acts.appendChild(save); acts.appendChild(cancel);
      b.appendChild(acts);
      b.appendChild(el("p","col-hint",
        "Оплаты привязаны к имени. Если переименовать ученика, старые оплаты останутся " +
        "на прежнем имени — их придётся поправить в таблице."));
    }

    var ps = el("div","dsec");
    ps.appendChild(el("div","dsec-h","Оплаты ученика"));
    var mine = DATA["Оплаты"].filter(function(o){ return o["ученик"] === r["ученик"]; }).reverse();
    if(!mine.length){
      ps.appendChild(el("p","empty","Оплат пока нет."));
    } else {
      var tw2 = el("div","tbl-wrap");
      var tb2 = document.createElement("table");
      tb2.appendChild(head(["Дата","Месяц","Сумма","Чек"]));
      var b2 = document.createElement("tbody");
      mine.forEach(function(o){
        var tr = document.createElement("tr");
        tr.appendChild(el("td","muted", o["дата"]));
        tr.appendChild(el("td", null, o["месяц"]));
        tr.appendChild(el("td", null, o["сумма"]));
        tr.appendChild(el("td","muted", o["чек"]));
        b2.appendChild(tr);
      });
      tb2.appendChild(b2); tw2.appendChild(tb2); ps.appendChild(tw2);
      ps.appendChild(el("p","col-hint", "Всего оплачено: " + sum));
    }
    var pf = el("div","form");
    pf.style.marginTop = "12px";
    var mon  = mkInp("text", "сентябрь");
    var amt  = mkInp("number", String(r["абонемент"] || ""));
    var chek = mkSel(["нет","да"], "нет");
    var padd = el("button","btn","Записать оплату");
    [["Месяц",mon],["Сумма",amt],["Чек",chek]].forEach(function(pair){
      pf.appendChild(fld(pair[0], pair[1]));
    });
    pf.appendChild(padd);
    padd.addEventListener("click", function(){
      if(!amt.value){ toast("Сумма пустая"); return; }
      send("add","Оплаты",{row:{
        "дата":today(), "ученик":r["ученик"], "месяц":mon.value.trim(),
        "сумма":amt.value, "чек":chek.value, "заметка":""
      }}).then(function(){ return afterWrite("Оплата записана"); })
        .catch(function(e){ toast("Ошибка: " + e.message); });
    });
    ps.appendChild(pf);
    b.appendChild(ps);

    d.appendChild(b);
    w.appendChild(d);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ back.classList.add("on"); d.classList.add("on"); });
    });
  }

  function mark(v){
    var td = el("td");
    var ok = String(v).toLowerCase() === "да";
    td.appendChild(el("span", ok ? "pill" : "pill pill-warn", ok ? "есть" : "нет"));
    return td;
  }

  /* ——— Оплаты ——— */

  function renderPay(w){
    var p = el("div","panel");
    p.appendChild(el("h3", null, "Новая оплата"));
    var form = el("div","form");
    var who = document.createElement("input"); who.type="text"; who.placeholder="ученик";
    var mon = document.createElement("input"); mon.type="text"; mon.placeholder="сентябрь";
    var sum = document.createElement("input"); sum.type="number"; sum.placeholder="260";
    var chek = document.createElement("select");
    ["да","нет"].forEach(function(s){ var o=document.createElement("option"); o.value=s; o.textContent=s; chek.appendChild(o); });
    var add = el("button","btn","Записать");
    [["Ученик",who],["Месяц",mon],["Сумма",sum],["Чек",chek]].forEach(function(pair){
      var l = el("label"); l.appendChild(el("span",null,pair[0])); l.appendChild(pair[1]); form.appendChild(l);
    });
    form.appendChild(add);
    add.addEventListener("click", function(){
      if(!who.value.trim()) return;
      send("add","Оплаты",{row:{"дата":today(),"ученик":who.value.trim(),"месяц":mon.value.trim(),"сумма":sum.value,"чек":chek.value}})
        .then(function(){ who.value=""; sum.value=""; return afterWrite("Оплата записана"); })
        .catch(function(e){ toast("Ошибка: " + e.message); });
    });
    p.appendChild(form);
    w.appendChild(p);

    var t = el("div","panel");
    t.appendChild(el("h3", null, "Оплаты"));
    var rows = DATA["Оплаты"].slice().reverse();
    if(!rows.length){ t.appendChild(el("p","empty","Пока пусто.")); w.appendChild(t); return; }
    var tw = el("div","tbl-wrap");
    var tb = document.createElement("table");
    tb.appendChild(head(["Дата","Ученик","Месяц","Сумма","Чек"]));
    var body = document.createElement("tbody");
    rows.forEach(function(row){
      var tr = document.createElement("tr");
      tr.appendChild(el("td","muted", row["дата"]));
      tr.appendChild(el("td", null, row["ученик"]));
      tr.appendChild(el("td", null, row["месяц"]));
      tr.appendChild(el("td", null, row["сумма"]));
      tr.appendChild(mark(row["чек"]));
      body.appendChild(tr);
    });
    tb.appendChild(body); tw.appendChild(tb); t.appendChild(tw);
    w.appendChild(t);
  }

  /* ——— Календарь ——— */

  // контакты со страницы Насти: одна строка на пробное, ключ - время начала в миллисекундах
  function contactFor(iso){
    var t = Date.parse(iso);
    if(isNaN(t)) return null;
    var key = String(t);
    var rows = DATA["Контакты"] || [];
    for(var i = rows.length - 1; i >= 0; i--){
      if(String(rows[i]["ключ"]) === key) return rows[i];
    }
    return null;
  }
  function contactLines(iso){
    var c = contactFor(iso);
    if(!c) return [];
    var out = [];
    if(c["телеграм"]) out.push("Телеграм: " + c["телеграм"]);
    if(c["вайбер"])   out.push("Вайбер: " + c["вайбер"]);
    if(c["почта"])    out.push("Почта: " + c["почта"]);
    return out;
  }

  function renderCal(w){
    var busyList = CAL.filter(function(c){ return !c.free; });
    var freeList = CAL.filter(function(c){ return c.free; });

    var b = el("div","panel");
    b.appendChild(el("h3", null, "Назначенные пробные"));
    if(!busyList.length) b.appendChild(el("p","empty","Пока никого не записали."));
    busyList.forEach(function(c){
      var r = el("div"); r.style.padding = "8px 0"; r.style.borderTop = "1px solid var(--line)";
      var t1 = el("div", null, c.title); t1.style.fontWeight = "600"; t1.style.color = "var(--grape)";
      var t2 = el("div","muted", c.when); t2.style.fontSize = "13px";
      r.appendChild(t1); r.appendChild(t2);
      contactLines(c.iso).forEach(function(line){
        var ct = el("div", null, line);
        ct.style.fontSize = "13px";
        r.appendChild(ct);
      });
      if(c.meet){
        var a = document.createElement("a");
        a.href = c.meet; a.target = "_blank"; a.rel = "noopener";
        a.className = "muted"; a.style.fontSize = "12px"; a.textContent = "ссылка на встречу";
        r.appendChild(a);
      }
      b.appendChild(r);
    });
    w.appendChild(b);

    var f = el("div","panel");
    f.appendChild(el("h3", null, "Свободные окна"));
    if(!freeList.length) f.appendChild(el("p","empty","Окон нет - поставьте их в календарь «Окна для пробного»."));
    var byDay = {}, order = [];
    freeList.forEach(function(c){
      var d = c.when.split(",")[0] + "," + c.when.split(",")[1];
      if(!byDay[d]){ byDay[d] = []; order.push(d); }
      byDay[d].push(c.when.split(", ").pop());
    });
    order.forEach(function(d){
      var r = el("div"); r.style.padding = "7px 0"; r.style.borderTop = "1px solid var(--line)";
      r.style.display = "flex"; r.style.gap = "14px"; r.style.flexWrap = "wrap";
      var a = el("div","muted", d); a.style.minWidth = "150px"; a.style.fontSize = "13px";
      var bb = el("div","", byDay[d].join(", ")); bb.style.fontFamily = "var(--mono)"; bb.style.fontSize = "13px";
      r.appendChild(a); r.appendChild(bb);
      f.appendChild(r);
    });
    w.appendChild(f);
  }

  /* ——— старт ——— */

  function boot(){
    if(!key){ renderGate(); return; }
    app.innerHTML = "";
    var g = el("div","gate");
    g.appendChild(el("h2", null, "Загружаю…"));
    app.appendChild(g);
    Promise.all([load(), loadCalendar()]).then(function(res){
      render();
    }).catch(function(e){
      key = "";
      try{ localStorage.removeItem(KEY_STORE); }catch(e2){}
      renderGate("Ключ не подошёл. Попробуйте ещё раз.");
    });
  }

  boot();
})();
</script>
